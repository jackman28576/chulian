<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFC">
<title>初练 · 会员健康档案智能体</title>
<style>
  :root{
    --bg:#FAFAFC; --surface:#FFFFFF; --ink:#0B0B0F; --sub:#6E6E73;
    --hair:rgba(0,0,0,.08); --hair-strong:rgba(0,0,0,.14);
    --accent:#0071E3; --accent-press:#0059B3;
    --stop:#D70015; --warn:#B25000; --info:#0071E3; --ok:#1D7A4C;
    --shadow-s:0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-m:0 10px 34px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --ease:cubic-bezier(.22,.8,.24,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    opacity:0;transition:opacity .5s var(--ease);
  }
  body.ready{opacity:1}
  button{font:inherit;color:inherit}

  /* 开场 */
  #intro{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;transition:transform .72s var(--ease),opacity .5s ease}
  #intro.done{transform:translateY(-100%);opacity:0;pointer-events:none}
  #intro .mark{width:74px;height:74px}
  #intro .mark path,#intro .mark rect{stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.1s var(--ease) .1s forwards}
  #intro .mark .pulse{stroke:var(--accent);animation-delay:.55s}
  @keyframes draw{to{stroke-dashoffset:0}}
  #intro h1{margin:0;font-size:34px;font-weight:640;letter-spacing:.34em;text-indent:.34em;opacity:0;animation:titleIn 1s var(--ease) .5s forwards}
  #intro p{margin:0;color:var(--sub);font-size:13px;letter-spacing:.16em;opacity:0;animation:titleIn 1s var(--ease) .8s forwards}
  @keyframes titleIn{from{opacity:0;transform:translateY(10px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.12em}}

  /* 顶栏 */
  header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:0 18px;height:56px;
    background:rgba(250,250,252,.76);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;margin-right:6px}
  .brand svg{width:21px;height:21px}
  .brand svg path,.brand svg rect{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .brand .pulse{stroke:var(--accent)}
  .member{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border-radius:999px;border:.5px solid var(--hair-strong);background:rgba(255,255,255,.8);cursor:pointer;transition:all .2s var(--ease);max-width:280px}
  .member:hover{background:#fff;border-color:rgba(0,0,0,.2)}
  .member .av2{width:22px;height:22px;border-radius:7px;background:#0B0B0F;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
  .member .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member .cv{width:10px;height:10px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .ghost{height:30px;padding:0 12px;border-radius:999px;border:.5px solid var(--hair-strong);background:rgba(255,255,255,.7);color:var(--sub);font-size:12.5px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
  .ghost:hover{background:#fff;color:var(--ink);border-color:rgba(0,0,0,.22)}
  .ghost:active{transform:scale(.97)}
  #badge{font-size:11.5px;color:var(--sub);white-space:nowrap}

  /* 主体 */
  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .wrap{max-width:720px;margin:0 auto;padding:30px 20px 150px}

  .hero{transition:opacity .45s var(--ease),transform .45s var(--ease);min-height:calc(100vh - 310px);display:flex;flex-direction:column;justify-content:center}
  .hero.gone{opacity:0;transform:translateY(-12px) scale(.98);pointer-events:none;height:0;min-height:0;overflow:hidden;margin:0;padding:0}
  .hero h2{margin:0 0 6px;font-size:30px;line-height:1.25;font-weight:640;letter-spacing:-.025em}
  .hero .sub{margin:0 0 14px;color:var(--sub);font-size:14px}
  #scene{width:100%;height:330px;display:block;margin:4px 0 0}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sugg button{border:.5px solid var(--hair-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;box-shadow:var(--shadow-s);transition:all .2s var(--ease)}
  .sugg button:hover{transform:translateY(-1px);box-shadow:var(--shadow-m)}
  .sugg button:active{transform:scale(.98)}

  /* 消息 */
  .row{display:flex;gap:11px;margin-bottom:22px;align-items:flex-start;animation:rise .42s var(--ease) both}
  .row.me{flex-direction:row-reverse}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .av{flex:0 0 28px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:600}
  .av.a{background:#0B0B0F;color:#fff}
  .av.m{background:rgba(0,0,0,.07);color:var(--sub)}
  .bubble{max-width:78%;white-space:pre-wrap;word-break:break-word}
  .row.a .bubble{background:var(--surface);border:.5px solid var(--hair);border-radius:4px 18px 18px 18px;padding:14px 16px;box-shadow:var(--shadow-s)}
  .row.me .bubble{background:var(--accent);color:#fff;border-radius:18px 4px 18px 18px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,113,227,.22)}
  .meta{margin-top:10px;font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
  .meta button{background:none;border:0;color:var(--sub);font-size:12px;cursor:pointer;padding:0;border-bottom:.5px dotted rgba(0,0,0,.28);transition:color .2s}
  .meta button:hover{color:var(--accent)}
  .detail{margin-top:10px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#3B3B40;background:#F5F5F7;border-radius:10px;padding:12px;white-space:pre-wrap;display:none}
  .verdict{margin-top:10px;padding-left:12px;border-left:2px solid var(--hair)}
  .verdict.ok{border-color:var(--ok)}
  .verdict.warn{border-color:var(--warn)}
  .verdict.stop{border-color:var(--stop)}
  .verdict.info{border-color:var(--info)}
  .typing{display:inline-flex;gap:4px;align-items:center;height:16px}
  .typing i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.28);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* 输入 */
  footer{position:sticky;bottom:0;z-index:40;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(250,250,252,.98) 55%,rgba(250,250,252,0))}
  .composer{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .field{flex:1;display:flex;align-items:center;background:var(--surface);border:.5px solid var(--hair-strong);border-radius:22px;box-shadow:var(--shadow-s);padding:2px 6px 2px 16px;min-height:46px;transition:border-color .2s,box-shadow .2s}
  .field:focus-within{border-color:rgba(0,113,227,.55);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
  textarea{flex:1;border:0;resize:none;background:transparent;padding:11px 6px;font:inherit;line-height:1.4;max-height:120px;min-height:22px;outline:none;overflow:hidden}
  .send{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:#fff;display:grid;place-items:center;margin:4px;transition:transform .18s var(--ease),background .2s}
  .send:hover{background:var(--accent-press)}
  .send:active{transform:scale(.94)}
  .send svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .hint{max-width:720px;margin:8px auto 0;text-align:center;color:#9A9AA0;font-size:11px}

  /* 弹层 */
  .sheet-mask{position:fixed;inset:0;z-index:200;background:rgba(12,14,20,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;top:50%;z-index:201;width:min(460px,calc(100vw - 40px));max-height:80vh;overflow:auto;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .3s var(--ease);background:var(--surface);border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.18);padding:22px}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:640;letter-spacing:-.01em}
  .sheet .desc{margin:0 0 16px;color:var(--sub);font-size:12.5px}
  .mrow{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;cursor:pointer;transition:background .18s}
  .mrow:hover{background:#F5F5F7}
  .mrow.on{background:rgba(0,113,227,.07)}
  .mrow .av3{width:32px;height:32px;border-radius:10px;background:#0B0B0F;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 32px}
  .mrow .txt{min-width:0}
  .mrow .txt b{display:block;font-size:13.5px;font-weight:600}
  .mrow .txt small{display:block;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tagline{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:rgba(215,0,21,.09);color:var(--stop);margin-left:6px}
  .sheet label{display:block;font-size:11.5px;color:var(--sub);margin:12px 0 5px}
  .sheet input,.sheet select{width:100%;padding:9px 11px;border:.5px solid var(--hair-strong);border-radius:10px;font:inherit;font-size:13.5px;outline:none;background:#fff}
  .sheet input:focus,.sheet select:focus{border-color:rgba(0,113,227,.55);box-shadow:0 0 0 3px rgba(0,113,227,.1)}
  .sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet .actions{display:flex;gap:8px;margin-top:18px}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;transition:all .2s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-press)}
  .btn.plain{background:#F0F0F3;color:var(--ink)}
  .btn.plain:hover{background:#E7E7EB}
  .btn[disabled]{opacity:.45;cursor:default}
  .hr{height:.5px;background:var(--hair);margin:16px 0}

  @media (max-width:560px){
    header{padding:0 12px;gap:6px}
    #badge{display:none}
    .brand span{display:none}
    .member{max-width:160px}
    .wrap{padding:18px 14px 120px}
    .hero{min-height:calc(100vh - 250px)}
    .hero h2{font-size:23px}
    .hero .sub{font-size:13px}
    #scene{height:240px}
    .sugg button{padding:7px 12px;font-size:12.5px}
    .bubble{max-width:86%}
    .row{margin-bottom:18px}
    textarea{font-size:16px;padding:10px 4px}
    footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
    .hint{font-size:10.5px}
    .sheet{width:calc(100vw - 24px);max-height:86vh}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>

<div id="intro">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="8" y="8" width="48" height="48" rx="14"></rect>
    <path class="pulse" d="M8 34h11l5-9 7 17 6-12 5 4h14"></path>
  </svg>
  <h1>初练</h1>
  <p>会员健康档案智能体</p>
</div>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5.5"></rect>
      <path class="pulse" d="M3 13h4l2-3.5 3 7 2.4-4.6L16.6 13H21"></path>
    </svg>
    <span>初练</span>
  </div>
  <button class="member" id="memberBtn">
    <span class="av2" id="memberAv">林</span>
    <span class="nm" id="memberName">林女士</span>
    <svg class="cv" viewBox="0 0 12 12"><path d="M2 4.5 6 8.5 10 4.5"></path></svg>
  </button>
  <div class="right">
    <span id="badge">技能 2.0.0 · 55 项测试 · 离线规则</span>
    <button class="ghost" id="cfg">模型</button>
    <button class="ghost" id="reset">重来</button>
  </div>
</header>

<main id="log">
  <div class="wrap" id="wrap">
    <section class="hero" id="hero">
      <h2>今天状态怎么样？</h2>
      <p class="sub" id="heroSub">说一句就行，缺的信息我会问。</p>
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="sugg">
        <button data-fill="今天有点累，腰酸4分，昨晚只睡了5小时">有点累，腰酸 4 分</button>
        <button data-fill="今天状态不错，没有不舒服，睡了7个半小时">状态不错</button>
        <button data-fill="今天胸口有点闷，还有点头晕">胸口发闷</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="composer">
    <div class="field">
      <textarea id="input" rows="1" placeholder="说说今天的状态，比如：有点累、腰酸 4 分"></textarea>
    </div>
    <button class="send" id="send" aria-label="发送">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"></path></svg>
    </button>
  </div>
  <div class="hint">判定由确定性规则引擎给出 · 不构成医疗建议 · 请勿输入真实健康信息</div>
</footer>

<!-- 会员选择 -->
<div class="sheet-mask" id="mask1"></div>
<div class="sheet" id="memberSheet" role="dialog" aria-label="选择会员">
  <h3>会员</h3>
  <p class="desc">选一位继续，或登记新会员。</p>
  <div id="memberList"></div>
  <div class="hr"></div>
  <h3>登记会员</h3>
  <p class="desc">只填必要信息，其余留空也能开始。</p>
  <label>称呼</label>
  <input id="regName" placeholder="例如：王女士">
  <div class="grid2">
    <div><label>训练经验（年）</label><input id="regYears" type="number" min="0" max="40" value="1"></div>
    <div><label>水平</label>
      <select id="regLevel"><option>初</option><option>中</option><option>高</option></select>
    </div>
  </div>
  <label>健身目标</label>
  <input id="regGoal" placeholder="例如：体态改善、增肌">
  <label>既往诊断或手术（没有就留空）</label>
  <input id="regInjury" placeholder="例如：腰椎间盘突出术后（2026-02）">
  <label>专业人员给过的活动限制（没有就留空）</label>
  <input id="regRestrict" placeholder="例如：避免脊柱屈曲负荷">
  <div class="actions">
    <button class="btn primary" id="regSave">登记并切换</button>
    <button class="btn plain" id="regCancel">取消</button>
  </div>
</div>

<!-- 模型接入 -->
<div class="sheet-mask" id="mask2"></div>
<div class="sheet" id="modelSheet" role="dialog" aria-label="模型接入">
  <h3>模型接入</h3>
  <p class="desc">填任意 OpenAI 兼容接口，理解更自由。判定仍由引擎给出；不填则用离线规则。</p>
  <label>API Key</label>
  <input id="cfg-key" placeholder="sk-..." autocomplete="off">
  <label>Base URL</label>
  <input id="cfg-base" placeholder="https://api.deepseek.com">
  <label>模型名</label>
  <input id="cfg-model" placeholder="deepseek-chat">
  <div class="actions">
    <button class="btn primary" id="cfg-save">保存</button>
    <button class="btn plain" id="cfg-clear">清除</button>
  </div>
  <p class="desc" style="margin-top:12px">密钥只存在这台设备的浏览器里，不会写进文件。</p>
</div>

function num(v, field, lo, hi){
  if(typeof v !== 'number' || !isFinite(v)) throw new Error(field + ' 必须是数字');
  if(v < lo || v > hi) throw new Error(field + ' 超出范围');

}
function parseDate(s){
  if(typeof s !== 'string') return null;
  const m = s.trim().match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ].*)?$/);
  if(m){ const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d) ? null : d; }

  if(m2){ const d = new Date(+m2[1], +m2[2]-1, 1); return isNaN(d) ? null : d; }
  return null;
}
function addMonths(d, n){ const x = new Date(d.getTime()); x.setMonth(x.getMonth()+n); return x; }

function planGate(db, ev){
  if(ev.status_code === 'continue') return [true,''];
  if(ev.status_code === 'review' && approvedReview(db, ev.visit_id)) return [true,''];
  if(ev.status_code === 'pause') return [false, '当前为「暂停活动」（'+ev.rule+'），属于急性信号或未到期禁训，不能通过复核解除；请暂停本次安排，待身体恢复后重新填报'];
  if(ev.status_code === 'missing') return [false, '当前为「补充资料」，资料不完整时不得生成正式计划；请先补齐后再评估'];
  return [false, '当前为「'+ev.status+'」，未通过复核，不能生成正式计划'];
}
function createPlan(db){
  db.C2_plans = db.C2_plans || []; db.C1_visits = db.C1_visits || [];
  const ev = assess(db);
  const ok = planGate(db, ev);
  if(!ok[0]) throw new Error(ok[1]);
  const visit = ev.visit_id;
  const same = db.C1_visits.filter(v => v.visit_id === visit).pop();
  const reduced = same && typeof same.fatigue === 'number' && same.fatigue >= 7;
  const sets = reduced ? 1 : (ev.status_code === 'review' ? 2 : 3);
  const exp = db.A5_experience || {};
  const goals = (db.A4_goal||[]).join('、') || '一般体能维护';
  const restr = (db.A9_restrictions||[]).map(r => r.item).join('；') || '按已确认的活动边界执行';
  const training = `围绕${goals}安排中立位呼吸、肩胛控制与轻柔髋部活动，每项 ${sets} 组，每组 6—8 次；经验级别：${exp.equipment || '未注明'}。`;
  const dietText = (db.A10_diet && db.A10_diet.text) || '未提供饮食偏好';
  const diet = `维持规律三餐与适量饮水，结合既有记录（${dietText}）避免推荐不适宜食物；不提供治疗性饮食方案。`;
  const sp = db.A11_sleep_profile || {};
  const parts = [];
  if(typeof sp.average_hours === 'number') parts.push('平均 ' + sp.average_hours + 'h');
  if(typeof sp.quality === 'number') parts.push('自评质量 ' + sp.quality + '/5');
  if(sp.issue && !['无','无特殊','无特殊问题'].includes(sp.issue)) parts.push(sp.issue);
  const sleep = `保持固定起床时间，睡前30分钟减少屏幕刺激；结合既有睡眠记录（${parts.join('、') || '未提供'}），先观察作息稳定性。`;
  const version = 'v' + (db.C2_plans.length + 1);
  (db.C2_plans||[]).forEach(p => { if(p.status === 'active'){ p.status = 'superseded'; p.superseded_by = version; } });
  const reasons = ['依据会员目标、训练经验、活动限制和当日风险状态生成'];
  const last = db.C1_visits[db.C1_visits.length-1];

  if(reduced) reasons.push('离店疲劳达到 7/10 以上，下一版训练量下调');
  const limitations = [restr, '专业限制优先；不替代医疗、营养或康复专业意见'];
  if((db.A9_confirmation||{}).status === 'not_provided') limitations.unshift('活动限制未提供：本次不安排脊柱屈曲与关节高负荷动作（保守边界）');

    limitations, change_reasons: reasons,
    diff_from_previous: prev ? ['training','diet','sleep'].filter(k => prev[k] !== ({training,diet,sleep})[k])
      .map(k => ({section:{training:'训练',diet:'饮食',sleep:'睡眠'}[k], before:prev[k], after:{training,diet,sleep}[k], reason:reasons.join('；')})) : []};
  db.C2_plans.push(plan);
  return plan;
}
function addFeedback(db, payload){
  db.C1_visits = db.C1_visits || []; db.C7_revisions = db.C7_revisions || [];

  if(cur && payload.visit_id !== cur) throw new Error(`反馈的到店记录 ${payload.visit_id} 与当前到店记录 ${cur} 不一致；计划调整只依据本次到店反馈`);
  ['completion_pct','rpe','sleep_hours','fatigue'].forEach(k => num(payload[k], k, 0, 100));
  const keys = ['visit_id','completion_pct','rpe','diet_adherence','sleep_hours','fatigue','notes'];
  const exist = db.C1_visits.find(v => v.visit_id === payload.visit_id);
  if(exist && keys.every(k => exist[k] === payload[k])) return [exist, null];
  if(exist){
    db.C7_revisions.push({record_id:'C1-'+payload.visit_id, before: JSON.parse(JSON.stringify(exist)), after: JSON.parse(JSON.stringify(payload))});
    Object.assign(exist, payload);
  }else{
    db.C1_visits.push(Object.assign({record_id:'C1-'+payload.visit_id}, payload));
  }
  const ev = assess(db);
  let plan = null;
  if(planGate(db, ev)[0]) plan = createPlan(db);
  return [exist || db.C1_visits[db.C1_visits.length-1], plan];
}

const CFG_KEY = 'chulian-llm-v1';
const SYS_PROMPT = `你是「初练」，健身场馆的会员健康档案助手。
把用户说的话转成结构化字段和意图，供确定性规则引擎使用。只输出 JSON：
{"intent":"visit|review|plan|feedback|diagnosis|switch|smalltalk",
 "fields":{"fatigue":数字或null,"sleep_hours":数字或null,"pain":数字或null,
           "pain_text":"部位描述","acute_signals":[]},
 "ack":"一句自然的回话，两行以内，不要下结论"}
规则：fatigue/pain 0-10；sleep_hours 以小时计，半小时记 0.5；
只有明确说出胸痛/胸口疼/胸闷/心慌/晕倒才填 acute_signals；
说"是不是某病/严重吗"→diagnosis；"复核/通过"→review；"出计划"→plan；
"练完了/反馈"→feedback；"换个人/切换会员"→switch。
分档结论由引擎输出，你不写。`;

function llmCfg(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; }
}
async function llmUnderstand(text, label){
  const cfg = llmCfg();
  if(!cfg.key) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try{
    const res = await fetch((cfg.base || 'https://api.deepseek.com').replace(/\/+$/,'') + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key},
      body: JSON.stringify({model: cfg.model || 'deepseek-chat', temperature: 0,
        response_format: {type:'json_object'},
        messages: [{role:'system', content: SYS_PROMPT},
                   {role:'user', content: `当前会员：${label}\n用户说：${text}`}]}),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const data = JSON.parse(body.choices[0].message.content);
    const f = data.fields || {};
    const clean = {};
    ['fatigue','sleep_hours','pain'].forEach(k => { if(typeof f[k] === 'number' && isFinite(f[k])) clean[k] = f[k]; });
    if(typeof f.pain_text === 'string' && f.pain_text.trim()) clean.pain_text = f.pain_text.trim();
    if(Array.isArray(f.acute_signals) && f.acute_signals.length) clean.acute = f.acute_signals.map(String);
    return {intent: String(data.intent || '').toLowerCase(), fields: clean, ack: String(data.ack || '')};
  }catch(err){
    return {intent:'', fields:{}, ack:'', error: String(err.message || err)};
  }finally{
    clearTimeout(timer);
  }
}

const KEY = 'chulian-single-v1';
let state = load();

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {members: JSON.parse(JSON.stringify(MEMBERS)), current: 0, draft: {}, need: [], stage: 'idle', last: null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function db(){ return state.members[state.current]; }

const wrap = document.getElementById('wrap');
const log = document.getElementById('log');
const input = document.getElementById('input');

function bubble(who, text, details, tone){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const av = document.createElement('div');
  av.className = 'av ' + (who === 'a' ? 'a' : 'm');

    const btn = document.createElement('button'); btn.textContent = '查看依据';

    btn.onclick = () => { d.style.display = d.style.display === 'block' ? 'none' : 'block'; };
    meta.appendChild(btn); body.appendChild(meta); body.appendChild(d);
  }
  row.appendChild(av); row.appendChild(body); wrap.appendChild(row);

function actionChip(row, label, fn){

  const b = document.createElement('button'); b.textContent = '→ ' + label; b.onclick = fn;
  meta.appendChild(b); row.querySelector('.bubble').appendChild(meta);
}
async function say(text){
  bubble('me', text);
  const m = db();
  const u = await llmUnderstand(text, `${m.A2_display_name}（${m.A1_member_id}）`);
  reply(text, u || {intent:'', fields:{}, ack:''});
}

function extract(t){
  const s = t.replace(/\s/g,'');
  const d = {};
  const half = s.replace(/(\d+)个半小时/g,'$1.5小时').replace(/半小时/g,'0.5小时');
  let m = half.match(/疲劳[^\d]{0,4}(\d{1,2})/);
  if(!m) m = half.match(/(?:累|困|疲惫)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
  if(m) d.fatigue = +m[1];
  m = half.match(/(?:睡|睡眠)[^\d]{0,8}(\d+(?:\.\d+)?)\s*个?\s*(?:小时|h|钟)/);
  if(m) d.sleep_hours = +m[1];
  if(/疼|痛|酸|紧/.test(half)){
    m = half.match(/(\d{1,2})\s*分/);
    d.pain = m ? +m[1] : 3;
    const pm = half.match(/([腰膝肩背颈][^\s，,。]{0,3})/);
    d.pain_text = pm ? pm[1] : '不适';
  }
  if(/无不适|没有不舒服|没什么不舒服|没有不适|挺好的|还好|没感觉/.test(half)){ d.pain = 0; d.pain_text = '无明显不适'; }
  if(/胸痛|胸口疼|胸闷|心慌|晕|昏/.test(half)) d.acute = ['胸痛'];
  return d;
}

function reply(text, u){
  const t = text.trim();
  const intent = (u && u.intent) || '';
  if(intent === 'diagnosis' || /(是不是|会不会|严不严重|什么病|怎么回事).{0,12}(病|突出|炎|劳损|撕裂|损伤|骨折)/.test(t)){
    bubble('a','我不能判断病因，也不能诊断。这需要医生结合检查来判断。我可以帮你记录症状，并按流程提交给教练或专业人员复核。');
    return;
  }
  if(intent === 'switch' || /切换会员|换个人/.test(t)){
    state.current = (state.current + 1) % state.members.length;
    state.draft = {}; state.need = []; state.stage = 'idle'; state.last = null; save();
    const m = db();
    bubble('a', `好，现在处理的是 ${m.A2_display_name}（${m.A1_member_id}），目标：${(m.A4_goal||[]).join('、')}。说说今天的状态就行。`);
    return;
  }
  Object.assign(state.draft, extract(t));
  if(u && u.fields) Object.assign(state.draft, u.fields);

  // 上一轮问过"还差哪几项"，用户只回数字也能接住
  if(state.need && state.need.length){
    const nums = (t.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    const hasKeyword = /疲劳|累|困|睡|小时|疼|痛|酸|分/.test(t);
    if(nums.length && !hasKeyword){
      const filled = [];
      for(const v of nums){
        if(!state.need.length) break;
        const k = state.need[0];
        const isFatigue = k === 'fatigue';
        if(isFatigue ? (v < 0 || v > 10) : (v < 0 || v > 24)){
          bubble('a', `${isFatigue ? '疲劳是 0–10' : '睡眠是 0–24 小时'}，${v} 不在这个范围里，再给一个？`);
          return;
        }
        state.draft[k] = v; state.need.shift();
        filled.push(isFatigue ? `疲劳 ${v}/10` : `睡眠 ${v}h`);
      }
      if(filled.length) bubble('a', '记下了：' + filled.join('、') + '。');
      if(state.need.length){
        bubble('a', `还差 ${state.need.length} 项：${state.need.map(k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时').join('、')}。`);
        return;
      }
    }
  }

  if(state.stage === 'assessed' && (intent === 'review' || /复核|通过|可以练/.test(t))){
    if(!state.last || state.last.status_code !== 'review'){
      bubble('a', `这次判定是${state.last ? state.last.status : '继续训练'}，不需要复核。要么直接出计划，要么说说新的状态我重新判。`);
      return;
    }
    const m = db();
    m.C5_reviews = m.C5_reviews || [];
    const visit = m.B_current.B1_visit_id;
    m.C5_reviews.push({review_id:`PR-${visit}-${String(m.C5_reviews.length+1).padStart(2,'0')}`, visit_id:visit,
      decision:'approved', note:'仅允许中立位低负荷练习，禁止脊柱屈曲负荷', recorded_by:'合成教练', recorded_at:new Date().toISOString()});
    state.stage = 'reviewed'; save();
    const row = bubble('a','记下了：合成教练已复核通过（仅允许中立位低负荷，禁止脊柱屈曲）。\n注意，复核通过不改动活动限制，那条限制仍然生效。');
    actionChip(row, '出计划', () => say('出计划'));
    return;
  }

  if((intent === 'plan' || /出计划|生成计划/.test(t)) && (state.stage === 'assessed' || state.stage === 'reviewed')){
    try{
      const plan = createPlan(db()); save(); state.stage = 'planned';
      const sets = (plan.training.match(/每项 (\d+) 组/) || [])[1] || '?';
      const row = bubble('a', `${plan.version} 好了，每项 ${sets} 组。\n训练：${plan.training}\n饮食：${plan.diet}\n睡眠：${plan.sleep}\n限制：${plan.limitations.slice(0,2).join('；')}`);
      actionChip(row, '练完了，反馈', () => say('练完了'));
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  if(intent === 'feedback' || /练完|反馈|做完了/.test(t)){
    const fm = t.match(/疲劳[^\d]{0,4}(\d{1,2})/) || t.match(/(?:累|疲劳)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
    if(!fm){ bubble('a','练完感觉怎么样？说个疲劳分（0–10）和完成度（%）就行，比如"疲劳 8，完成度 80"。'); return; }
    const cm = t.match(/完成度\D{0,4}(\d{1,3})/);
    try{
      const [rec, plan] = addFeedback(db(), {visit_id: db().B_current.B1_visit_id,
        completion_pct: cm ? +cm[1] : 80, rpe: 6, diet_adherence:'三餐规律',
        sleep_hours: 5.5, fatigue: +fm[1], notes:'对话录入'});
      save();
      if(plan){
        bubble('a', `收到，已经更新到 ${plan.version}。${plan.change_reasons[plan.change_reasons.length-1]}。\n今天辛苦了，下一版训练量已经按你的状态调过。`,
          JSON.stringify(plan.diff_from_previous, null, 2));
      }else{
        bubble('a','这条反馈和上次一样，我记下了，计划不用改。');
      }
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  const d = state.draft;
  // 急性信号一票否决：不等其余字段，直接判定
  const hasAcute = Array.isArray(d.acute) && d.acute.length > 0;
  const needKeys = [];
  if(!hasAcute){
    if(d.fatigue === undefined) needKeys.push('fatigue');
    if(d.sleep_hours === undefined) needKeys.push('sleep_hours');
  }
  if(needKeys.length){
    state.need = needKeys.slice();
    const labelOf = k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时';
    const got = [];
    if(d.pain !== undefined) got.push('疼痛 ' + d.pain + '/10');
    if(d.fatigue !== undefined) got.push('疲劳 ' + d.fatigue + '/10');
    if(d.sleep_hours !== undefined) got.push('睡眠 ' + d.sleep_hours + 'h');
    bubble('a', (got.length ? '记下了：' + got.join('、') + '。\n' : '') +
      `还差 ${needKeys.length} 项就能判断：${needKeys.map(labelOf).join('、')}。直接回数字也行，按顺序给就好。`);
    return;
  }
  state.need = [];

  const m = db();
  m.B_current = {
    B1_visit_id: 'V-' + new Date().toISOString().slice(0,19).replace(/[-:T]/g,''),
    B2_body_feeling: {text: d.pain_text || '无特别说明', pain_score: d.pain === undefined ? 0 : d.pain, acute_signals: d.acute || []},
    B3_fatigue: d.fatigue,
    B4_sleep_last: {hours: d.sleep_hours, quality: 3},
    B5_vitals: {resting_hr: 70},
    recorded_at: new Date().toISOString(),
    recorded_by: '会员本人', source: '会员本人'
  };
  const ev = assess(m);
  state.last = ev; state.stage = 'assessed'; state.draft = {}; save();

  if(!hasAcute){
    bubble('a', ((u && u.ack) ? u.ack + '\n' : '') + `好，按你说的记下了：疲劳 ${m.B_current.B3_fatigue}/10、睡眠 ${m.B_current.B4_sleep_last.hours}h` +
      (m.B_current.B2_body_feeling.pain_score ? `、疼痛 ${m.B_current.B2_body_feeling.pain_score}/10` : '') + '。');
  }
  const detail = JSON.stringify({分档:ev.status, 规则:ev.rule, 依据字段:ev.basis_field_ids, 理由:ev.reasons, 下一步:ev.next_step}, null, 2);
  const row = bubble('a', `${ev.status}（${ev.rule}）。\n依据：${ev.basis_field_ids.slice(0,6).join('、')}。\n${ev.reasons[0] || ''}\n${ev.next_step}\n${DISCLAIMER}`, detail, TONE[ev.status_code]);
  if(ev.status_code === 'review') actionChip(row, '复核通过', () => say('复核通过'));
  if(ev.status_code === 'continue') actionChip(row, '出计划', () => say('出计划'));
}

function switchTo(i, silent){

  save();

}

  get current(){ return state.current; },
  get members(){ return state.members; }
};

  /* 3D 场景 */
  const cv = $('scene');

    const ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), S = 1, tilt = 0, target = 0;
    const resize = () => {
      const r = cv.getBoundingClientRect();
      W = r.width; H = r.height;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      S = W < 520 ? 0.92 : 1.42;
    };
    resize(); addEventListener('resize', resize);
    cv.addEventListener('pointermove', e => {
      const r = cv.getBoundingClientRect();
      target = ((e.clientX - r.left) / r.width - .5) * .22;

    cv.addEventListener('pointerleave', () => { target = 0; });

    const iso = (x, y, z) => {
      const a = Math.PI / 6 + tilt;
      return [ (x - y) * Math.cos(a) * S, ((x + y) * Math.sin(a) - z) * S ];
    };

    function face(pts, fill, edge) {
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineJoin = 'round';
      ctx.strokeStyle = fill; ctx.lineWidth = 3; ctx.stroke();
      if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 1; ctx.stroke(); }
    }

    let GROUND = 9;
    function plate(cx, cy, r, fill) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.48, 0, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
    }

    function box(cx, cy, w, d, h, tone, accent) {
      const p = (x, y, z) => { const q = iso(x, y, z + GROUND); return [cx + q[0], cy + q[1]]; };
      const top = [p(-w/2,-d/2,h), p(w/2,-d/2,h), p(w/2,d/2,h), p(-w/2,d/2,h)];
      const left = [p(-w/2,-d/2,0), p(-w/2,d/2,0), p(-w/2,d/2,h), p(-w/2,-d/2,h)];
      const right = [p(w/2,-d/2,0), p(w/2,d/2,0), p(w/2,d/2,h), p(w/2,-d/2,h)];
      face(left, tone[2]);
      face(right, tone[1]);
      face(top, tone[0], accent);
    }

    function shadow(cx, cy, rx, ry, a) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      g.addColorStop(0, `rgba(9,12,20,${a})`);
      g.addColorStop(1, 'rgba(9,12,20,0)');
      ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
      ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.restore();
    }

    // 浮空岛：一块有厚度的地面
    function island(cx, cy) {
      const p = (x, y, z) => { const q = iso(x, y, z); return [cx + q[0], cy + q[1]]; };
      const w = 112, d = 112, h = 8;
      const left = [p(-w,-d,0), p(-w,d,0), p(-w,d,h), p(-w,-d,h)];
      const right = [p(w,-d,0), p(w,d,0), p(w,d,h), p(w,-d,h)];
      face(left, '#E4E8EF');
      face(right, '#D2D8E2');
      face([p(-w,-d,h), p(w,-d,h), p(w,d,h), p(-w,d,h)], '#FFFFFF');
      return h;
    }

    function floor(cx, cy) {
      const size = 300, steps = 12;
      ctx.save(); ctx.lineWidth = 1;
      for (let i = 0; i <= steps; i++) {
        const t = -size/2 + (size/steps)*i;
        const a = .085 * (1 - Math.abs(t)/size*1.15);
        ctx.strokeStyle = `rgba(12,18,28,${Math.max(a,0)})`;
        let A = iso(t, -size/2, 0), B = iso(t, size/2, 0);
        ctx.beginPath(); ctx.moveTo(cx+A[0], cy+A[1]); ctx.lineTo(cx+B[0], cy+B[1]); ctx.stroke();
        A = iso(-size/2, t, 0); B = iso(size/2, t, 0);
        ctx.beginPath(); ctx.moveTo(cx+A[0], cy+A[1]); ctx.lineTo(cx+B[0], cy+B[1]); ctx.stroke();
      }
      ctx.restore();
    }

    const T = {
      white: ['#FFFFFF', '#E9ECF2', '#D6DBE4'],
      soft:  ['#F7F8FA', '#E2E6ED', '#CDD3DD'],
      dark:  ['#3A3F49', '#23272F', '#171A20'],
      blue:  ['#EAF2FE', '#D3E2FA', '#BBD0F0'],
      metal: ['#DDE1E8', '#C3C9D4', '#AEB5C2']
    };

    let t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      tilt += (target + Math.sin(t * .25) * .02 - tilt) * .07;
      ctx.clearRect(0, 0, W, H);
      const cx = W/2 + tilt * 90, cy = H * .56 + Math.sin(t * .8) * 2;

      const glow = ctx.createRadialGradient(cx, cy - 40, 8, cx, cy - 40, Math.max(W, H) * .6);
      glow.addColorStop(0, 'rgba(0,113,227,.07)');
      glow.addColorStop(.5, 'rgba(0,113,227,.02)');
      glow.addColorStop(1, 'rgba(0,113,227,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      // 岛下投影
      shadow(cx + 4, cy + 20, 168, 44, .10);

      const F = island(cx, cy);
      GROUND = F;

      // 物体落在岛面上的接触阴影
      const at = (x, y) => { const q = iso(x, y, GROUND); return [cx + q[0], cy + q[1]]; };
      let p0 = at(-24, -6);  shadow(p0[0], p0[1], 74, 18, .12);
      p0 = at(58, -34);      shadow(p0[0], p0[1], 40, 13, .12);
      p0 = at(-66, 26);      shadow(p0[0], p0[1], 34, 12, .09);
      p0 = at(6, 40);        shadow(p0[0], p0[1], 30, 10, .10);

      // 训练床
      box(cx - 24, cy - 6, 86, 26, 6, T.metal);
      box(cx - 24, cy - 6, 78, 20, 7, T.white);
      box(cx - 62, cy - 6, 6, 6, 13, T.dark);
      box(cx + 14, cy - 6, 6, 6, 13, T.dark);
      box(cx - 70, cy - 20, 18, 16, 4, T.white);

      // 器械架 + 杠铃
      box(cx + 58, cy - 34, 15, 15, 46, T.metal);
      box(cx + 58, cy - 58, 42, 3, 3, T.dark);
      plate(cx + 37, cy - 58, 7, '#23272F');
      plate(cx + 79, cy - 58, 7, '#23272F');

      // 训练垫
      box(cx - 66, cy + 26, 36, 22, 2, T.blue);

      // 哑铃
      box(cx + 6, cy + 40, 24, 9, 3, T.soft);
      box(cx - 4, cy + 40, 6, 10, 8, T.dark);
      box(cx + 16, cy + 40, 6, 10, 8, T.dark);

      // 壶铃
      box(cx + 58, cy + 40, 11, 11, 9, T.dark);

      // 蓝色脉冲
      const pulse = .5 + .5 * Math.sin(t * 1.8);
      const q = iso(-24, -6, GROUND + 14);
      ctx.save();
      ctx.globalAlpha = .34 + pulse * .3; ctx.fillStyle = '#0071E3';
      ctx.beginPath(); ctx.arc(cx + q[0], cy + q[1], 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = .09 + pulse * .12;
      ctx.beginPath(); ctx.arc(cx + q[0], cy + q[1], 9 + pulse * 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* 真三维场景：联网时用 three.js，离线自动留在上面的等距插画 */
  (async () => {
    let THREE = null;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
    } catch (e) { return; }
    if (!THREE || !cv) return;

    const W0 = cv.clientWidth || 640, H0 = cv.clientHeight || 330;
    cv.style.display = 'none';
    const host = document.createElement('div');
    host.style.cssText = 'width:100%;height:330px;position:relative;margin:4px 0 0;'
      + 'background:radial-gradient(60% 70% at 50% 62%, #FFFFFF 0%, rgba(250,250,252,0) 72%)';
    cv.parentNode.insertBefore(host, cv.nextSibling);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W0, H0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, W0 / H0, 0.1, 100);
    camera.position.set(3.25, 2.35, 3.75);
    camera.lookAt(0, 0.5, 0);

    const hemi = new THREE.HemisphereLight(0xffffff, 0xdde3ec, 0.9);
    scene.add(hemi);
    scene.add(new THREE.AmbientLight(0xffffff, 0.28));
    const key = new THREE.DirectionalLight(0xffffff, 2.7);
    key.position.set(3, 6, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.radius = 6;
    key.shadow.bias = -0.0008;
    const cam = key.shadow.camera;
    cam.left = -4; cam.right = 4; cam.top = 4; cam.bottom = -4; cam.near = 0.5; cam.far = 16;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xdfe9ff, 0.6);
    rim.position.set(-4, 2.5, -3);
    scene.add(rim);

    const mat = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
    const M = {
      white: mat(0xffffff, 0.92),
      soft: mat(0xf1f3f7, 0.9),
      grey: mat(0xccd3df, 0.85),
      dark: mat(0x24272e, 0.45, 0.35),
      blue: mat(0x0a63d6, 0.72),
      metal: mat(0xc9ceda, 0.35, 0.55)
    };

    const root = new THREE.Group();
    root.scale.setScalar(1.0);
    scene.add(root);

    function add(geo, material, x, y, z, rx = 0, ry = 0, rz = 0, shadow = true) {
      const m = new THREE.Mesh(geo, material);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      m.castShadow = shadow; m.receiveShadow = true;
      root.add(m); return m;
    }

    // 地面
    const floor = add(new THREE.CircleGeometry(3.0, 96), mat(0xeff2f7, 0.96), 0, 0, 0, -Math.PI / 2);
    floor.castShadow = false;

    // 接触阴影贴片
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = 128;
    const c2 = cvs.getContext('2d');
    const rg = c2.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(10,14,22,.38)');
    rg.addColorStop(.55, 'rgba(10,14,22,.16)');
    rg.addColorStop(1, 'rgba(10,14,22,0)');
    c2.fillStyle = rg; c2.fillRect(0, 0, 128, 128);
    const blobTex = new THREE.CanvasTexture(cvs);
    function blob(x, z, r, op) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2),
        new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity: op || .9, depthWrite: false }));
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.006, z);
      scene.add(m);
    }
    blob(-0.3, 0, 0.95, .85);
    blob(0.95, 0, 0.5, .7);
    blob(-0.72, 0.86, 0.62, .6);
    blob(0.4, 0.9, 0.42, .55);
    const edge = new THREE.Mesh(new THREE.RingGeometry(2.99, 3.02, 96), mat(0xe3e7ee, 0.9));
    edge.rotation.x = -Math.PI / 2; edge.position.y = 0.001; scene.add(edge);
    // 训练床
    add(new THREE.BoxGeometry(1.46, 0.07, 0.5), M.grey, -0.3, 0.4, 0);
    add(new THREE.BoxGeometry(1.4, 0.1, 0.44), M.white, -0.3, 0.47, 0);
    for (const dx of [-0.86, 0.26]) {
      for (const dz of [-0.17, 0.17]) {
        add(new THREE.BoxGeometry(0.06, 0.4, 0.06), M.metal, dx, 0.2, dz);
      }
    }
    // 靠背
    add(new THREE.BoxGeometry(0.4, 0.09, 0.42), M.white, -0.86, 0.62, 0, 0, 0, 0.62);
    add(new THREE.BoxGeometry(0.06, 0.34, 0.06), M.metal, -0.86, 0.36, 0);

    // 深蹲架
    for (const dz of [-0.34, 0.34]) {
      add(new THREE.BoxGeometry(0.08, 0.96, 0.08), M.metal, 0.95, 0.48, dz);
      add(new THREE.BoxGeometry(0.26, 0.05, 0.14), M.grey, 0.95, 0.03, dz);
    }
    add(new THREE.BoxGeometry(0.07, 0.05, 0.7), M.metal, 0.95, 0.96, 0);
    // 杠铃
    add(new THREE.CylinderGeometry(0.02, 0.02, 1.22, 18), M.dark, 0.95, 1.0, 0, 0, 0, Math.PI / 2);
    for (const dx of [-0.52, 0.52]) {
      add(new THREE.CylinderGeometry(0.16, 0.16, 0.045, 30), M.dark, 0.95 + dx, 1.0, 0, 0, 0, Math.PI / 2);
      add(new THREE.CylinderGeometry(0.1, 0.1, 0.05, 24), M.grey, 0.95 + dx * 0.86, 1.0, 0, 0, 0, Math.PI / 2);
    }

    // 蓝色训练垫
    add(new THREE.BoxGeometry(0.72, 0.04, 0.94), M.blue, -0.72, 0.02, 0.86);

    // 哑铃
    add(new THREE.CylinderGeometry(0.024, 0.024, 0.4, 16), M.metal, 0.18, 0.1, 0.9, 0, 0, Math.PI / 2);
    for (const dx of [-0.16, 0.16]) {
      add(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 24), M.dark, 0.18 + dx, 0.1, 0.9, 0, 0, Math.PI / 2);
    }

    // 壶铃
    add(new THREE.SphereGeometry(0.145, 28, 20), M.dark, 0.62, 0.145, 0.9);
    add(new THREE.TorusGeometry(0.085, 0.026, 12, 24), M.dark, 0.62, 0.3, 0.9, 0, 0, 0);

    let targetRot = 0.5, rot = 0.5, ty = 0;
    host.addEventListener('pointermove', e => {
      const r = host.getBoundingClientRect();
      targetRot = 0.5 + ((e.clientX - r.left) / r.width - 0.5) * 0.9;
    });
    host.addEventListener('pointerleave', () => { targetRot = 0.5; });

    const cameraTarget = new THREE.Vector3(0, 0.55, 0);
    function loop(now) {
      const t = now / 1000;
      rot += (targetRot - rot) * 0.06;
      root.rotation.y = rot + Math.sin(t * 0.22) * 0.06;
      root.position.y = Math.sin(t * 0.8) * 0.015;
      camera.position.y = 2.5 + Math.sin(t * 0.5) * 0.03;
      camera.lookAt(cameraTarget);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    const fit = () => {
      const r = host.getBoundingClientRect();
      if (!r.width) return;
      const asp = r.width / r.height;
      camera.aspect = asp;
      camera.fov = 32;
      root.scale.setScalar(Math.min(1.12, Math.max(0.62, r.width / 620)));
      camera.updateProjectionMatrix();
      renderer.setSize(r.width, r.height);
    };
    fit();
    addEventListener('resize', fit);
  })();
})();
</script>

      }
      case 'review': {
        await clickText('复核通过'); await sleep(900);
        await clickText('出计划'); await sleep(1200);
        window.scrollTo(0, document.body.scrollHeight);
        break;
      }
      case 'feedback': await send('练完了，疲劳8，完成度80'); break;
      case 'contrast': {
        await clickText('切换会员'); await sleep(900);
        await send('今天状态还行，没有不舒服，睡了7个半小时');
        await send('疲劳2分');
        await sleep(500);
        await clickText('出计划');
        await sleep(900);
        window.scrollTo(0, document.body.scrollHeight);
        break;
      }
      case 'safety': {
        await send('我这是不是腰椎间盘突出？');
        await sleep(600);
        await send('今天胸口有点闷，还有点头晕');
        await sleep(900);
        window.scrollTo(0, document.body.scrollHeight);
        break;
      }
      case 'closing': {
        const c = document.createElement('div');
        c.style.cssText = 'position:fixed;inset:0;z-index:99997;display:flex;align-items:center;justify-content:center;background:rgba(246,247,249,.97)';
        c.innerHTML = '<div style="max-width:720px;padding:0 32px;line-height:2;font-size:16px;color:#17202b">' +
          '<div style="font-size:24px;font-weight:700;margin-bottom:18px">已实现 · 局限 · 下一步</div>' +
          '<div><b>已实现</b>：八项任务闭环、四档风险判定、计划版本与留痕、越界拒绝——全部合成数据演示</div>' +
          '<div style="margin-top:10px"><b>局限</b>：本地原型，未接入场馆表单与真实预约系统；规则阈值需专业人员审阅</div>' +
          '<div style="margin-top:10px"><b>下一步</b>：对接场馆填报表单，由专业人员审定规则，再做多用户与权限</div></div>';
        document.body.appendChild(c);
        await sleep(2200);
        break;
      }
    }
  }
  await at(TOTAL);
  setCap('演示结束');
})();

</script>

</html>
