<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初练 · 教练端</title>
<style>
  :root{
    --bg:#07080b; --ink:#eef3f9; --ink2:#c3cedb; --muted:#8a98aa;
    --glass:rgba(255,255,255,.065); --line:rgba(255,255,255,.12);
    --ok:#3ddc97; --warn:#f5b65a; --stop:#ff6b6b; --info:#8fb3d9;
    --sans:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 600px at 12% 8%,rgba(64,120,190,.18),transparent 62%),
      radial-gradient(800px 560px at 88% 92%,rgba(190,120,80,.10),transparent 60%);
  }
  .topbar{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 22px;
          border-bottom:1px solid var(--line);background:rgba(8,10,14,.6);backdrop-filter:blur(16px)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.05em}
  .brand small{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:500}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tab{height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;color:var(--ink2);
       background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer}
  .tab.on{background:rgba(120,160,220,.20);border-color:rgba(150,190,240,.35);color:#fff}
  .spacer{flex:1}
  .link{color:var(--muted);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:1px}
  .link:hover{color:var(--ink)}
  main{position:relative;z-index:2;display:grid;grid-template-columns:320px 1fr;height:calc(100% - 61px)}
  .rail{border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  .rail h2{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin:0 0 10px}
  .m{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;cursor:pointer;
     border:1px solid transparent;margin-bottom:8px;transition:.2s}
  .m:hover{background:rgba(255,255,255,.05)}
  .m.on{background:var(--glass);border-color:rgba(255,255,255,.2)}
  .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 32px;
      background:rgba(120,160,220,.18);color:#cfe2f8;font-size:13px;font-weight:600}
  .m .t{min-width:0;flex:1}
  .m .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .t small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .pill.ok{color:#b8f0d4;border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.10)}
  .pill.warn{color:#ffd9a8;border-color:rgba(245,182,90,.35);background:rgba(245,182,90,.10)}
  .pill.stop{color:#ffc0b8;border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.12)}
  .pill.info{color:#cfe2f8;border-color:rgba(143,179,217,.35);background:rgba(143,179,217,.10)}
  .panel{overflow-y:auto;padding:24px 28px}
  .head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .head h1{font-size:22px;margin:0;font-weight:650}
  .head span{color:var(--muted);font-size:12.5px}
  .card{border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .card h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 10px;letter-spacing:.06em}
  .kv{display:flex;gap:12px;font-size:13px;padding:4px 0}
  .kv .k{color:var(--muted);flex:0 0 72px}
  .chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
  .empty{color:var(--muted);font-size:13px;line-height:1.9;padding:24px}
  .empty a{color:#9fd4ff}
  .note{color:var(--muted);font-size:11.5px;margin-top:10px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .lab{display:block;font-size:12px;color:var(--muted)}
  .lab input,.lab select,.lab textarea{display:block;width:100%;margin-top:4px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink);font:inherit}
  .lab textarea{resize:vertical}
  .acts{display:flex;align-items:center;gap:10px;margin-top:10px}
  .btn{height:34px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
       background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;font:inherit}
  .btn.primary{background:rgba(120,160,220,.22);border-color:rgba(150,190,240,.4)}
  .hint{font-size:12px;color:var(--muted)}
  .hint.bad{color:#ffb4a8}
  .pending{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;
    color:#ffd9a8;border:1px solid rgba(245,182,90,.4);background:rgba(245,182,90,.12)}
  .pending:empty{display:none}
  .login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(7,8,11,.94)}
  .login-card{width:340px;border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:24px}
  .login-card h2{margin:0 0 14px;font-size:18px}
  .login-card label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
  .login-card input,.login-card select{display:block;width:100%;margin-top:4px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit}
  .login-card button{width:100%;height:38px;margin-top:6px;border-radius:10px;border:1px solid rgba(150,190,240,.4);
    background:rgba(120,160,220,.22);color:#fff;cursor:pointer;font:inherit}
  #lg-err{min-height:18px;margin-top:8px}
  .tl{display:grid;grid-template-columns:92px 12px 1fr;gap:8px;align-items:baseline;padding:7px 0;font-size:12.5px;border-top:1px solid rgba(255,255,255,.06)}
  .tl:first-of-type{border-top:0}
  .tl .tt{color:var(--muted);font-size:11px;white-space:nowrap}
  .tl-dot{width:7px;height:7px;border-radius:50%;background:rgba(143,179,217,.7);margin-top:6px}
  .tl-body{color:var(--ink2);min-width:0}
  .tl-body b{color:var(--ink);font-weight:600;margin-right:4px;white-space:nowrap}
  #offline{position:fixed;top:66px;right:14px;z-index:90;display:none;padding:5px 10px;border-radius:999px;
    font-size:11.5px;color:#ffd9a8;border:1px solid rgba(245,182,90,.4);background:rgba(30,24,14,.9)}
  .tools{margin-top:18px}
  .tools .lan{font-size:11.5px;color:var(--ink2);word-break:break-all;margin:0 0 8px}
  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;max-height:158px}
    .rail h2{display:none}
    #list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
    .m{min-width:190px;margin-bottom:0}
    .tools{display:none}
    .panel{padding:16px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">初练 <small>COACH CONSOLE</small></div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <span class="pending" id="pending"></span>
  <a class="link" id="logout" href="#" style="display:none">退出</a>
  <a class="link" href="index.html">返回会员端 →</a>
</div>
<div id="offline">未连接服务 · 本地模式</div>
<main>
  <aside class="rail">
    <h2>我负责的会员</h2>
    <div id="list"></div>
    <div class="tools">
      <div class="rail-h">演示工具</div>
      <div class="lan" id="lanUrl">—</div>
      <div class="acts">
        <button class="btn" id="copyUrl">复制手机地址</button>
        <button class="btn" id="resetData">重置数据</button>
      </div>
    </div>
  </aside>
  <section class="panel" id="detail"></section>
</main>
<div class="login" id="login">
  <div class="login-card">
    <h2>教练登录</h2>
    <label>教练<select id="lg-coach"></select></label>
    <label>工号后四位<input id="lg-pin" inputmode="numeric" maxlength="4" placeholder="4 位数字"></label>
    <button id="lg-go">进入教练端</button>
    <div class="hint bad" id="lg-err"></div>
  </div>
</div>

<script>
const KEY = 'chulian-single-v1';
const COACHES = [
  { id: 'T-102', name: '张教练', field: '康复与术后恢复' },
  { id: 'T-108', name: '李教练', field: '力量与体能' }
];
const MAP = { 'L-0231': 'T-102', 'L-0247': 'T-102', 'L-0305': 'T-108' };
const TONE = { pause: 'stop', review: 'warn', supplement: 'info', continue: 'ok' };

let state = null;
try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}

/* ---------------- 与服务端同步 ---------------- */
const SYNC_ON = location.protocol !== 'file:';
let syncVersion = 0;
function pushState(onConflict) {
  if (!SYNC_ON) return;
  fetch('/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ version: syncVersion, state }) })
    .then(async r => {
      if (r.status === 409) {
        const cur = await r.json();
        state = cur.state || state;
        syncVersion = cur.version;
        if (typeof onConflict === 'function') onConflict(state);
        return fetch('/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ version: syncVersion, state }) })
          .then(x => x.ok ? x.json() : null);
      }
      return r.ok ? r.json() : null;
    })
    .then(res => {
      setOffline(false);
      if (res && typeof res.version === 'number') syncVersion = res.version;
      localStorage.setItem(KEY, JSON.stringify(state));
      render();
    })
    .catch(() => setOffline(true));
}
function setOffline(on) {
  const el = document.getElementById('offline');
  if (el) el.style.display = on ? 'block' : 'none';
}
function pull() {
  if (!SYNC_ON) return;
  fetch('/api/state').then(r => r.json()).then(d => {
    setOffline(false);
    if (!d || typeof d.version !== 'number' || d.version === syncVersion) return;
    syncVersion = d.version;
    if (d.state) { state = d.state; localStorage.setItem(KEY, JSON.stringify(state)); render(); }
    else { state = null; render(); }
  }).catch(() => setOffline(true));
}
function initTools() {
  fetch('/api/info').then(r => r.json()).then(d => {
    const el = document.getElementById('lanUrl');
    if (el && d.lan_url) el.textContent = d.lan_url;
  }).catch(() => {});
  const cp = document.getElementById('copyUrl');
  if (cp) cp.onclick = () => {
    const t = document.getElementById('lanUrl').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  };
  const rs = document.getElementById('resetData');
  if (rs) rs.onclick = () => {
    if (!confirm('重置所有演示数据？会员端和教练端都会回到初始状态。')) return;
    fetch('/api/reset', { method: 'POST' }).then(() => location.reload()).catch(() => {});
  };
}
initTools();
function initialPull() {
  if (!SYNC_ON) return;
  fetch('/api/state').then(r => r.json()).then(d => {
    if (!d) return;
    syncVersion = d.version || 0;
    if (d.state) { state = d.state; localStorage.setItem(KEY, JSON.stringify(state)); render(); }
  }).catch(() => {});
}
if (SYNC_ON) { setTimeout(initialPull, 0); setInterval(pull, 2000); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function lastPlan(m) {
  const p = m.C2_plans || [];
  return p.length ? p[p.length - 1] : null;
}
function lastVisit(m) {
  const v = m.C1_visits || [];
  return v.length ? v[v.length - 1] : null;
}
function currentReview(m) {
  const visit = (m.B_current || {}).B1_visit_id;
  const rs = (m.C5_reviews || []).filter(r => r.visit_id === visit);
  return rs.length ? rs[rs.length - 1] : null;
}

const PINS = { 'T-102': '0102', 'T-108': '0108' };
let loggedCoach = sessionStorage.getItem('chulian-coach') || null;
let coachId = loggedCoach || COACHES[0].id;
let selected = null;

function membersOf(id) {
  if (!state || !Array.isArray(state.members)) return [];
  return state.members.filter(m => MAP[m.A1_member_id] === id);
}

function renderTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  COACHES.forEach(c => {
    if (loggedCoach && c.id !== loggedCoach) return;
    const b = document.createElement('button');
    b.className = 'tab' + (c.id === coachId ? ' on' : '');
    b.textContent = c.name;
    b.title = c.field;
    b.onclick = () => { coachId = c.id; selected = null; render(); };
    box.appendChild(b);
  });
}

function renderList() {
  const box = document.getElementById('list');
  const list = membersOf(coachId);
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">这个教练还没有绑定会员。</div>';
    return;
  }
  list.forEach(m => {
    const v = m.A16_last_verdict;
    const plan = lastPlan(m);
    const visit = lastVisit(m);
    const el = document.createElement('div');
    el.className = 'm' + (selected === m.A1_member_id ? ' on' : '');
    el.innerHTML = '<div class="av">' + esc((m.A2_display_name || '会').replace(/（合成）/, '').slice(0, 1)) + '</div>' +
      '<div class="t"><b>' + esc((m.A2_display_name || '').replace(/（合成）/, '')) + '</b>' +
      '<small>' + esc(m.A1_member_id) + (plan ? ' · ' + esc(plan.version) : '') + (visit ? ' · 最近 ' + esc((visit.recorded_at || '').slice(5, 10)) : '') + '</small></div>' +
      (v ? '<span class="pill ' + (TONE[v.code] || 'info') + '">' + esc(v.status) + '</span>' : '<span class="pill">未填报</span>');
    el.onclick = () => { selected = m.A1_member_id; render(); };
    box.appendChild(el);
  });
}

function renderDetail() {
  const box = document.getElementById('detail');
  const list = membersOf(coachId);
  if (!list.length) {
    box.innerHTML = '<div class="empty">这个教练还没有绑定会员。</div>';
    return;
  }
  const m = list.find(x => x.A1_member_id === selected) || list[0];
  selected = m.A1_member_id;
  const v = m.A16_last_verdict;
  const plan = lastPlan(m);
  const visit = lastVisit(m);
  const rv = currentReview(m);
  const coach = COACHES.find(c => c.id === coachId) || {};
  const goal = (m.A4_goal || []).join('、');
  const pains = (m.A9_restrictions || []).map(r => typeof r === 'string' ? r : [r.item, r.level].filter(Boolean).join(' · '));
  const when = v && v.at ? new Date(v.at).toLocaleString('zh-CN', { hour12: false }) : '';
  const b = m.B_current || {};
  const feel = b.B2_body_feeling || {};
  const sleepH = (b.B4_sleep_last || {}).hours;
  const fillText = '疲劳 ' + (b.B3_fatigue === undefined ? '—' : b.B3_fatigue + '/10') +
    ' · 睡眠 ' + (sleepH === undefined ? '—' : sleepH + 'h') +
    ' · 疼痛 ' + (feel.pain_score === undefined ? '—' : feel.pain_score + '/10');
  const selfText = feel.text || '—';
  const vBasis = (v && Array.isArray(v.basis)) ? v.basis : [];
  const vReasons = (v && Array.isArray(v.reasons)) ? v.reasons : [];

  let reviewLine = '还没有复核记录';
  if (rv) reviewLine = (rv.decision === 'approved' ? '已复核通过' : '已否决') + ' · ' + esc(rv.recorded_by || '教练') + ' · ' + esc((rv.recorded_at || '').slice(0, 16).replace('T', ' '));
  else if (v && v.code === 'review') reviewLine = '待复核';

  let reviewBlock;
  if (rv) {
    reviewBlock = '<div class="card"><h3>复核记录</h3>' +
      '<div class="kv"><span class="k">结论</span><span>' + (rv.decision === 'approved' ? '通过' : '否决') + '</span></div>' +
      '<div class="kv"><span class="k">复核人</span><span>' + esc(rv.recorded_by || '—') + '</span></div>' +
      '<div class="kv"><span class="k">时间</span><span>' + esc((rv.recorded_at || '').slice(0, 16).replace('T', ' ')) + '</span></div>' +
      '<div class="kv"><span class="k">意见</span><span>' + esc(rv.note || '—') + '</span></div></div>';
  } else if (v && v.code === 'review') {
    reviewBlock = '<div class="card"><h3>复核</h3>' +
      '<div class="fgrid">' +
        '<label class="lab">结论<select id="rv-decision"><option value="">请选择</option><option value="approved">通过</option><option value="rejected">否决</option></select></label>' +
        '<label class="lab">复核人<input id="rv-name" value="' + esc(coach.name) + '"></label>' +
        '<label class="lab">工号<input id="rv-id" value="' + esc(coach.id) + '"></label>' +
      '</div>' +
      '<label class="lab">复核意见<textarea id="rv-note" rows="3" placeholder="写明允许的范围与限制，例：仅允许中立位低负荷练习，禁止脊柱屈曲负荷"></textarea></label>' +
      '<div class="acts"><button class="btn primary" id="rv-submit">提交复核</button><span class="hint bad" id="rv-hint"></span></div>' +
      '</div>';
  } else {
    reviewBlock = '<div class="card"><h3>复核</h3><div class="empty" style="padding:0">当前不需要复核。</div></div>';
  }

  const events = [];
  const pushEv = (t, label, text) => { if (label) events.push({ t: t || 0, label, text: text || '' }); };
  const intakeT = b.recorded_at ? Date.parse(b.recorded_at) : (v && v.at ? Date.parse(v.at) : 0);
  if (v) pushEv(intakeT, '会员填报', fillText);
  (m.C5_reviews || []).forEach(r => pushEv(Date.parse(r.recorded_at || 0),
    r.decision === 'approved' ? '复核通过' : '复核否决',
    (r.recorded_by || '') + (r.note ? ' · ' + r.note : '')));
  const reviewsAll = m.C5_reviews || [];
  const lastReviewT = reviewsAll.length ? Date.parse(reviewsAll[reviewsAll.length - 1].recorded_at || 0) : intakeT;
  (m.C2_plans || []).forEach((p, i) => pushEv(lastReviewT + (i + 1) * 1000, '计划 ' + p.version, p.status === 'active' ? '生效' : p.status));
  (m.C1_visits || []).forEach(x => pushEv(Date.parse(x.recorded_at || 0), '离店反馈',
    '完成度 ' + x.completion_pct + '% · 疲劳 ' + x.fatigue + '/10'));
  (m.C3_appointments || []).forEach(x => pushEv(Date.parse(x.created_at || x.recorded_at || x.start_at || 0),
    '预约 ' + (x.appointment_id || ''), (x.status || '') + (x.start_at ? ' · ' + x.start_at.slice(0, 16).replace('T', ' ') : '')));
  (m.C4_followups || []).forEach(x => pushEv(Date.parse(x.recorded_at || 0), '随访', (x.content || '').slice(0, 40)));
  events.sort((a, c) => a.t - c.t);
  const timeline = events.length
    ? '<div class="card"><h3>时间线</h3>' + events.slice(-8).map(e =>
        '<div class="tl"><span class="tt">' + (e.t ? new Date(e.t).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '—') + '</span>' +
        '<span class="tl-dot"></span><span class="tl-body"><b>' + esc(e.label) + '</b>' + (e.text ? esc(e.text) : '') + '</span></div>'
      ).join('') + '</div>'
    : '';

  box.innerHTML =
    '<div class="head"><h1>' + esc((m.A2_display_name || '').replace(/（合成）/, '')) + '</h1>' +
    '<span>' + esc(m.A1_member_id) + ' · 负责教练 ' + esc(coach.name) + '（' + esc(coach.id) + '）' + (goal ? ' · 目标 ' + esc(goal) : '') + '</span></div>' +
    '<div class="card"><h3>今日判定</h3>' +
      (v ? '<div class="kv"><span class="k">结论</span><span><span class="pill ' + (TONE[v.code] || 'info') + '">' + esc(v.status) + '</span> <span class="chip">' + esc(v.rule) + '</span></span></div>' +
           '<div class="kv"><span class="k">时间</span><span>' + esc(when) + '</span></div>' +
           '<div class="kv"><span class="k">会员填报</span><span>' + esc(fillText) + '</span></div>' +
           '<div class="kv"><span class="k">自述</span><span>' + esc(selfText) + '</span></div>' +
           (vBasis.length ? '<div class="kv"><span class="k">依据字段</span><span>' + vBasis.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</span></div>' : '') +
           (vReasons.length ? '<div class="kv"><span class="k">理由</span><span>' + esc(vReasons.join('；')) + '</span></div>' : '') +
           '<div class="kv"><span class="k">活动限制</span><span>' + (pains.length ? pains.map(p => '<span class="chip">' + esc(p) + '</span>').join('') : '无') + '</span></div>' +
           '<div class="kv"><span class="k">复核</span><span>' + reviewLine + '</span></div>'
         : '<div class="empty" style="padding:0">会员还没有填报今天的状态。</div>') +
    '</div>' +
    reviewBlock +
    '<div class="card"><h3>训练计划</h3>' +
      (plan ? '<div class="kv"><span class="k">版本</span><span>' + esc(plan.version) + ' · ' + esc(plan.status) + '</span></div>' +
              '<div class="kv"><span class="k">训练</span><span>' + esc(plan.training || '—') + '</span></div>' +
              '<div class="kv"><span class="k">限制</span><span>' + (pains.length ? pains.map(p => '<span class="chip">' + esc(p) + '</span>').join('') : '无') + '</span></div>'
            : '<div class="empty" style="padding:0">还没有生成计划。</div>') +
    '</div>' +
    '<div class="card"><h3>最近到店</h3>' +
      (visit ? '<div class="kv"><span class="k">' + esc((visit.recorded_at || '').slice(5, 10)) + '</span><span>完成度 ' + esc(visit.completion_pct) + '% · 疲劳 ' + esc(visit.fatigue) + '/10</span></div>' +
               '<div class="note">' + esc((m.C1_visits || []).length) + ' 条到店记录</div>'
             : '<div class="empty" style="padding:0">还没有到店记录。</div>') +
    '</div>' +
    timeline +
    '<div class="note">演示环境：数据由本地服务同步；账号体系为演示级口令，真实部署需要接入场馆账号。</div>';

  const rvBtn = document.getElementById('rv-submit');
  if (rvBtn) rvBtn.onclick = () => {
    const note = document.getElementById('rv-note').value.trim();
    const name = document.getElementById('rv-name').value.trim();
    const cid = document.getElementById('rv-id').value.trim();
    const hint = document.getElementById('rv-hint');
    const decision = document.getElementById('rv-decision').value;
    if (!decision) { hint.textContent = '请先选择复核结论'; return; }
    if (!name || !cid) { hint.textContent = '请填写复核人与工号'; return; }
    if (!note) { hint.textContent = '请填写复核意见'; return; }
    const target = list.find(x => x.A1_member_id === selected);
    const visitId = (target.B_current || {}).B1_visit_id;
    if (!visitId) { hint.textContent = '这位会员还没有到店记录'; return; }
    target.C5_reviews = target.C5_reviews || [];
    const rvObj = {
      review_id: 'PR-' + visitId + '-' + String(target.C5_reviews.length + 1).padStart(2, '0'),
      visit_id: visitId,
      decision: decision,
      note: note,
      recorded_by: name + '（' + cid + '）',
      source: '专业人员',
      recorded_at: new Date().toISOString()
    };
    target.C5_reviews.push(rvObj);
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
    pushState(st => {
      const m = (st.members || []).find(x => x.A1_member_id === target.A1_member_id);
      if (!m) return;
      m.C5_reviews = m.C5_reviews || [];
      if (!m.C5_reviews.some(r => r.review_id === rvObj.review_id)) m.C5_reviews.push(rvObj);
    });
  };
}

function render() {
  renderTabs();
  renderList();
  renderDetail();
  refreshBadge();
}

function refreshBadge() {
  const n = membersOf(coachId).filter(m => {
    const v = m.A16_last_verdict;
    return v && v.code === 'review' && !currentReview(m);
  }).length;
  const el = document.getElementById('pending');
  if (el) el.textContent = n ? ('待复核 ' + n) : '';
  document.title = n ? ('初练 · 教练端（' + n + '）') : '初练 · 教练端';
}

function initLogin() {
  const sel = document.getElementById('lg-coach');
  COACHES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.name + '（' + c.id + '）';
    sel.appendChild(o);
  });
  if (loggedCoach) sel.value = loggedCoach;
  const box = document.getElementById('login');
  const logout = document.getElementById('logout');
  if (loggedCoach) { box.style.display = 'none'; logout.style.display = ''; }
  else { box.style.display = 'flex'; }
  logout.onclick = e => { e.preventDefault(); sessionStorage.removeItem('chulian-coach'); location.reload(); };
  document.getElementById('lg-go').onclick = () => {
    const cid = sel.value;
    const pin = document.getElementById('lg-pin').value.trim();
    const err = document.getElementById('lg-err');
    if (pin !== PINS[cid]) { err.textContent = '工号后四位不正确'; return; }
    sessionStorage.setItem('chulian-coach', cid);
    loggedCoach = cid; coachId = cid;
    box.style.display = 'none'; logout.style.display = '';
    render();
  };
  document.getElementById('lg-pin').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('lg-go').click();
  });
}

addEventListener('storage', e => {
  if (e.key !== KEY) return;
  try {
    state = JSON.parse(e.newValue || 'null');
    if (state && Array.isArray(state.members)) render();
  } catch (err) {}
});

initLogin();

if (!state || !Array.isArray(state.members)) {
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('list').innerHTML = '';
  document.getElementById('detail').innerHTML =
    '<div class="empty">还没有会员数据。<br>先打开 <a href="index.html">会员端</a>，填写一次今天的状态，再回来。</div>';
} else {
  render();
}
</script>
</body>
</html>
