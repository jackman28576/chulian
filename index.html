<html lang="zh-CN">
<head>

<title>初练 · 会员健康档案智能体</title>
<style>
  :root{
    --bg:#FAFAFC; --surface:#FFFFFF; --ink:#0B0B0F; --sub:#6E6E73;
    --hair:rgba(0,0,0,.08); --hair-strong:rgba(0,0,0,.14);
    --accent:#0071E3; --accent-press:#0059B3;
    --stop:#D70015; --warn:#B25000; --info:#0071E3; --ok:#1D7A4C;
    --shadow-s:0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-m:0 8px 30px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
    --ease:cubic-bezier(.22,.8,.24,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    opacity:0;transition:opacity .5s var(--ease);
  }
  body.ready{opacity:1}
  button{font:inherit;color:inherit}

  /* ---------- 开场 ---------- */
  #intro{
    position:fixed;inset:0;z-index:1000;background:var(--bg);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
    transition:transform .72s var(--ease),opacity .5s ease;
  }
  #intro.done{transform:translateY(-100%);opacity:0;pointer-events:none}
  #intro .mark{width:74px;height:74px}
  #intro .mark path,#intro .mark rect{
    stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.1s var(--ease) .1s forwards;
  }
  #intro .mark .pulse{stroke:var(--accent);animation-delay:.55s}
  @keyframes draw{to{stroke-dashoffset:0}}
  #intro h1{
    margin:0;font-size:34px;font-weight:640;letter-spacing:.34em;text-indent:.34em;
    opacity:0;animation:titleIn 1s var(--ease) .5s forwards;
  }
  #intro p{
    margin:0;color:var(--sub);font-size:13px;letter-spacing:.16em;
    opacity:0;animation:titleIn 1s var(--ease) .8s forwards;
  }
  @keyframes titleIn{from{opacity:0;transform:translateY(10px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.12em}}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
    padding:0 20px;height:54px;
    background:rgba(250,250,252,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--hair);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
  .brand svg{width:22px;height:22px}
  .brand svg path,.brand svg rect{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .brand .pulse{stroke:var(--accent)}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;
    font-size:11.5px;color:var(--sub);background:rgba(0,0,0,.04);white-space:nowrap
  }
  .chip i{width:5px;height:5px;border-radius:50%;background:var(--ok);display:block}
  header .right{margin-left:auto;display:flex;gap:8px}
  .ghost{
    height:30px;padding:0 13px;border-radius:999px;border:.5px solid var(--hair-strong);
    background:rgba(255,255,255,.7);color:var(--sub);font-size:12.5px;cursor:pointer;
    transition:all .2s var(--ease);
  }
  .ghost:hover{background:#fff;color:var(--ink);border-color:rgba(0,0,0,.22)}
  .ghost:active{transform:scale(.97)}

  /* ---------- 主体 ---------- */
  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .wrap{max-width:720px;margin:0 auto;padding:34px 20px 150px}

  /* 空态：等距健身房 */
  .hero{
    transition:opacity .45s var(--ease),transform .45s var(--ease);
    min-height:calc(100vh - 300px);display:flex;flex-direction:column;justify-content:center;
  }
  .hero.gone{
    opacity:0;transform:translateY(-12px) scale(.98);pointer-events:none;
    height:0;min-height:0;overflow:hidden;margin:0;padding:0
  }
  .hero h2{
    margin:0 0 6px;font-size:30px;line-height:1.25;font-weight:640;letter-spacing:-.025em;
  }
  .hero .sub{margin:0 0 18px;color:var(--sub);font-size:14px}
  #scene{width:100%;height:310px;display:block;margin:6px 0 2px}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .sugg button{
    border:.5px solid var(--hair-strong);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow-s);transition:all .2s var(--ease)
  }
  .sugg button:hover{transform:translateY(-1px);box-shadow:var(--shadow-m)}
  .sugg button:active{transform:scale(.98)}

  /* 消息 */
  .row{display:flex;gap:11px;margin-bottom:22px;align-items:flex-start;animation:rise .42s var(--ease) both}
  .row.me{flex-direction:row-reverse}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .av{
    flex:0 0 28px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
    font-size:12px;font-weight:600;letter-spacing:0
  }
  .av.a{background:#0B0B0F;color:#fff}
  .av.m{background:rgba(0,0,0,.07);color:var(--sub)}
  .bubble{max-width:78%;white-space:pre-wrap;word-break:break-word}
  .row.a .bubble{
    background:var(--surface);border:.5px solid var(--hair);border-radius:4px 18px 18px 18px;
    padding:14px 16px;box-shadow:var(--shadow-s)
  }
  .row.me .bubble{
    background:var(--accent);color:#fff;border-radius:18px 4px 18px 18px;padding:12px 16px;
    box-shadow:0 6px 18px rgba(0,113,227,.22)
  }
  .meta{margin-top:10px;font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
  .meta button{
    background:none;border:0;color:var(--sub);font-size:12px;cursor:pointer;padding:0;
    border-bottom:.5px dotted rgba(0,0,0,.28);transition:color .2s
  }
  .meta button:hover{color:var(--accent)}
  .detail{
    margin-top:10px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#3B3B40;
    background:#F5F5F7;border-radius:10px;padding:12px;white-space:pre-wrap;display:none
  }
  .verdict{margin-top:10px;padding-left:12px;border-left:2px solid var(--hair)}
  .verdict.ok{border-color:var(--ok)}
  .verdict.warn{border-color:var(--warn)}
  .verdict.stop{border-color:var(--stop)}
  .verdict.info{border-color:var(--info)}
  .typing{display:inline-flex;gap:4px;align-items:center;height:16px}
  .typing i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.28);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

  /* ---------- 输入 ---------- */
  footer{
    position:sticky;bottom:0;z-index:40;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(250,250,252,.98) 55%,rgba(250,250,252,0));
  }
  .composer{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .field{
    flex:1;display:flex;align-items:center;background:var(--surface);border:.5px solid var(--hair-strong);
    border-radius:22px;box-shadow:var(--shadow-s);padding:2px 6px 2px 16px;transition:border-color .2s,box-shadow .2s
  }
  .field:focus-within{border-color:rgba(0,113,227,.55);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
  textarea{
    flex:1;border:0;resize:none;background:transparent;padding:11px 6px;font:inherit;line-height:1.45;
    max-height:120px;min-height:24px;outline:none
  }
  .send{
    width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:#fff;display:grid;place-items:center;margin:4px;
    transition:transform .18s var(--ease),background .2s
  }
  .send:hover{background:var(--accent-press)}
  .send:active{transform:scale(.94)}
  .send svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .hint{max-width:720px;margin:8px auto 0;text-align:center;color:#9A9AA0;font-size:11px;letter-spacing:.01em}

  @media (max-width:560px){
    header{padding:0 14px}
    header .chip{display:none}
    .wrap{padding:24px 14px 130px}
    .hero h2{font-size:24px}
    #scene{height:210px}
    .bubble{max-width:88%}
    textarea{font-size:16px}
    footer{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }
</style>
</head>

  return addMonths(issued, 12) < today;
}
function latestReview(db, visit){
  const list = (db.C5_reviews||[]).filter(r => r.visit_id === visit);
  return list.length ? list[list.length-1] : null;
}
function approvedReview(db, visit){
  const r = latestReview(db, visit);
  return r && r.decision === 'approved' ? r : null;
}
function result(db, code, rule, reasons, basis, next){
  return {member_id: db.A1_member_id, visit_id: (db.B_current||{}).B1_visit_id,
          status_code: code, status: STATUS[code], rule, reasons, basis_field_ids: basis,
          next_step: next, disclaimer: DISCLAIMER};
}
function assess(db){
  const b = db.B_current || {};
  const visit = b.B1_visit_id;
  try{
    const feeling = (b.B2_body_feeling && typeof b.B2_body_feeling === 'object') ? b.B2_body_feeling : {};
    const vitals = b.B5_vitals || {};
    let acute = Array.isArray(feeling.acute_signals) ? feeling.acute_signals.slice() : [];
    if(vitals.acute_injury_within_24h) acute.push('24 小时内急性外伤');
    if(acute.length) return result(db,'pause','R1', acute, ['B2','B5'], '暂停活动并联系场馆专业人员；急性或严重不适应及时就医。');

    const fr = b.B3_fatigue, sl = (b.B4_sleep_last||{}), hr0 = sl.hours;
    const painRaw = feeling.pain_score === undefined ? 0 : feeling.pain_score;
    const act = db.A6_recent_activity || {};
    const spikeRaw = act.intensity_increase_pct;
    const hrRaw = vitals.resting_hr, tempRaw = vitals.temperature_c;
    const fatigue = fr === undefined || fr === null ? null : num(fr,'B3 疲劳',0,10);
    const hours = hr0 === undefined || hr0 === null ? null : num(hr0,'B4 睡眠',0,24);
    const pain = painRaw === null ? null : num(painRaw,'B2 疼痛',0,10);
    const spike = spikeRaw === undefined || spikeRaw === null ? null : num(spikeRaw,'A6 强度增幅',0,1000);
    const hr = hrRaw === undefined || hrRaw === null ? null : num(hrRaw,'B5 静息心率',20,220);
    const temp = tempRaw === undefined || tempRaw === null ? null : num(tempRaw,'B5 体温',30,45);

    if(hr !== null && (hr < 50 || hr > 100)) acute.push('静息心率 ' + hr);
    if(temp !== null && temp >= 37.5) acute.push('体温 ' + temp + '℃');
    if(acute.length) return result(db,'pause','R1', acute, ['B5'], '暂停活动并联系场馆专业人员；急性或严重不适应及时就医。');

    if(!b.recorded_at) return result(db,'review','R0',['到店记录缺少 recorded_at 时间戳'],['B1'],'补齐到店时间后再判定，不得以系统当天日期顶替。');
    const today = parseDate(b.recorded_at);
    if(!today) return result(db,'review','R0',['到店时间无法解析：'+b.recorded_at],['B1','B2'],'更正到店时间后再判定。');

    const advice = db.A8_professional_advice || [];
    for(const a of advice){
      if(!a.prohibit_training) continue;
      if(!a.valid_until){ acute.push('未注明有效期但明确禁训的专业意见'); continue; }
      const until = parseDate(a.valid_until);
      if(!until) return result(db,'review','R0',['禁训意见的有效期无法解析：'+a.valid_until],['A8'],'人工核实禁训期限。');
      if(until >= today) acute.push('未到期明确禁训专业意见');
    }
    if(acute.length) return result(db,'pause','R1', acute, ['B2','B5','A8'], '暂停活动并联系场馆专业人员。');

    const restrictions = db.A9_restrictions;
    const conf = db.A9_confirmation || {};
    const ids = new Set(advice.map(a => a.advice_id));
    const dangling = (restrictions||[]).filter(r => r && r.ref && !ids.has(r.ref)).map(r => r.ref);
    if(dangling.length) return result(db,'review','R0',['活动限制引用了不存在的专业意见：'+dangling.join('、')],['A8','A9'],'核实活动限制来源后再判定。');

    if((db.data_quality_conflicts||[]).length) return result(db,'review','R2-b', db.data_quality_conflicts, ['A7','A8','A9'], '核实冲突前不生成正式训练计划。');

    const expiredOnly = conf.status === 'expired_only' ||
      ((restrictions||[]).length > 0 && (restrictions||[]).every(r => {
        const a = advice.find(x => x.advice_id === (r && r.ref));
        return a && adviceExpired(a, today);
      }));
    if(expiredOnly) return result(db,'review','R2-c',['限制仅来自已过期专业意见'],['A8','A9'],'更新专业意见后再确认活动边界。');

    const missing = [];
    if(!db.A5_experience) missing.push('A5 训练经验');
    if(!db.A6_recent_activity) missing.push('A6 近期运动');
    if(!visit) missing.push('B1 到店记录编号');
    if(!feeling.text) missing.push('B2 身体感受');
    if(fatigue === null) missing.push('B3 疲劳程度');
    if(hours === null) missing.push('B4 昨晚睡眠');
    if(!(restrictions||[]).length && !['confirmed_none','not_provided'].includes(conf.status)) missing.push('A9 活动限制确认');
    if(act && act.intensity_increase_pct === undefined) missing.push('A6 强度增幅');
    if(missing.length) return result(db,'missing','R3', missing.slice(0,3), ['A5','A6','A9','B2','B3','B4'], '最多补充上述三项；未知不等于健康。');

    const flags = db.A12_risk_flags || [];
    if(flags.length && (fatigue >= 7 || hours < 5 || spike > 50)){
      const reasons = ['存在常驻风险标记 ' + flags.length + ' 项'];
      if(fatigue >= 7) reasons.push('疲劳 ' + fatigue + '/10');
      if(hours < 5) reasons.push('睡眠 ' + hours + 'h');
      if(spike > 50) reasons.push('近4周强度增幅 ' + spike + '%');
      return result(db,'review','R2-a', reasons, ['A6','A12','B3','B4'], '由教练或相应专业人员复核，确认前不生成正式计划。');
    }
    if(fatigue >= 8 || hours < 5 || (pain !== null && pain >= 6) || spike > 50){
      const reasons = [];
      if(fatigue >= 8) reasons.push('疲劳 ' + fatigue + '/10');
      if(hours < 5) reasons.push('睡眠 ' + hours + 'h');
      if(pain !== null && pain >= 6) reasons.push('疼痛 ' + pain + '/10');
      if(spike > 50) reasons.push('强度增幅 ' + spike + '%');
      return result(db,'review','R2-d', reasons, ['A6','B2','B3','B4'], '先复核状态；不得仅以降低强度替代风险升级。');
    }
    const reasons = ['未发现规则表中的暂停或复核条件'];
    if(conf.status === 'not_provided') reasons.push('活动限制为本人未提供，按保守边界执行');
    return result(db,'continue','R4', reasons, ['A5','A6','A9','B2','B3','B4'], '按既有活动限制安排训练，出现不适立即停止。');
  }catch(err){
    return result(db,'review','R0',['资料无法可靠解析：'+err.message],['DATA_QUALITY'],'由人工核对资料；解析异常不得默认放行。');
  }
}

function planGate(db, ev){
  if(ev.status_code === 'continue') return [true,''];
  if(ev.status_code === 'review' && approvedReview(db, ev.visit_id)) return [true,''];
  if(ev.status_code === 'pause') return [false, '当前为「暂停活动」（'+ev.rule+'），属于急性信号或未到期禁训，不能通过复核解除；请暂停本次安排，待身体恢复后重新填报'];
  if(ev.status_code === 'missing') return [false, '当前为「补充资料」，资料不完整时不得生成正式计划；请先补齐后再评估'];
  return [false, '当前为「'+ev.status+'」，未通过复核，不能生成正式计划'];
}
function createPlan(db){
  db.C2_plans = db.C2_plans || []; db.C1_visits = db.C1_visits || [];
  const ev = assess(db);
  const ok = planGate(db, ev);
  if(!ok[0]) throw new Error(ok[1]);
  const visit = ev.visit_id;
  const same = db.C1_visits.filter(v => v.visit_id === visit).pop();
  const reduced = same && typeof same.fatigue === 'number' && same.fatigue >= 7;
  const sets = reduced ? 1 : (ev.status_code === 'review' ? 2 : 3);
  const exp = db.A5_experience || {};
  const goals = (db.A4_goal||[]).join('、') || '一般体能维护';
  const restr = (db.A9_restrictions||[]).map(r => r.item).join('；') || '按已确认的活动边界执行';
  const training = `围绕${goals}安排中立位呼吸、肩胛控制与轻柔髋部活动，每项 ${sets} 组，每组 6—8 次；经验级别：${exp.equipment || '未注明'}。`;
  const dietText = (db.A10_diet && db.A10_diet.text) || '未提供饮食偏好';
  const diet = `维持规律三餐与适量饮水，结合既有记录（${dietText}）避免推荐不适宜食物；不提供治疗性饮食方案。`;
  const sp = db.A11_sleep_profile || {};
  const parts = [];
  if(typeof sp.average_hours === 'number') parts.push('平均 ' + sp.average_hours + 'h');
  if(typeof sp.quality === 'number') parts.push('自评质量 ' + sp.quality + '/5');
  if(sp.issue && !['无','无特殊','无特殊问题'].includes(sp.issue)) parts.push(sp.issue);
  const sleep = `保持固定起床时间，睡前30分钟减少屏幕刺激；结合既有睡眠记录（${parts.join('、') || '未提供'}），先观察作息稳定性。`;
  const version = 'v' + (db.C2_plans.length + 1);
  (db.C2_plans||[]).forEach(p => { if(p.status === 'active'){ p.status = 'superseded'; p.superseded_by = version; } });
  const reasons = ['依据会员目标、训练经验、活动限制和当日风险状态生成'];
  const last = db.C1_visits[db.C1_visits.length-1];
  if(last) reasons.push(`上次离店（${last.visit_id}）完成度 ${last.completion_pct}%，疲劳 ${last.fatigue}/10`);
  if(reduced) reasons.push('离店疲劳达到 7/10 以上，下一版训练量下调');
  const limitations = [restr, '专业限制优先；不替代医疗、营养或康复专业意见'];
  if((db.A9_confirmation||{}).status === 'not_provided') limitations.unshift('活动限制未提供：本次不安排脊柱屈曲与关节高负荷动作（保守边界）');
  const prev = db.C2_plans[db.C2_plans.length-1];
  const plan = {version, status:'active', training, diet, sleep,
    basis_field_ids:['A4','A5','A9','A10','A11','B1'].concat(last?['C1']:[]),
    limitations, change_reasons: reasons,
    diff_from_previous: prev ? ['training','diet','sleep'].filter(k => prev[k] !== ({training,diet,sleep})[k])
      .map(k => ({section:{training:'训练',diet:'饮食',sleep:'睡眠'}[k], before:prev[k], after:{training,diet,sleep}[k], reason:reasons.join('；')})) : []};
  db.C2_plans.push(plan);
  return plan;
}
function addFeedback(db, payload){
  db.C1_visits = db.C1_visits || []; db.C7_revisions = db.C7_revisions || [];
  const cur = (db.B_current||{}).B1_visit_id;
  if(cur && payload.visit_id !== cur) throw new Error(`反馈的到店记录 ${payload.visit_id} 与当前到店记录 ${cur} 不一致；计划调整只依据本次到店反馈`);
  ['completion_pct','rpe','sleep_hours','fatigue'].forEach(k => num(payload[k], k, 0, 100));
  const keys = ['visit_id','completion_pct','rpe','diet_adherence','sleep_hours','fatigue','notes'];
  const exist = db.C1_visits.find(v => v.visit_id === payload.visit_id);
  if(exist && keys.every(k => exist[k] === payload[k])) return [exist, null];
  if(exist){
    db.C7_revisions.push({record_id:'C1-'+payload.visit_id, before: JSON.parse(JSON.stringify(exist)), after: JSON.parse(JSON.stringify(payload))});
    Object.assign(exist, payload);
  }else{
    db.C1_visits.push(Object.assign({record_id:'C1-'+payload.visit_id}, payload));
  }
  const ev = assess(db);
  let plan = null;
  if(planGate(db, ev)[0]) plan = createPlan(db);
  return [exist || db.C1_visits[db.C1_visits.length-1], plan];
}

/* ---------------- 大模型（可选，浏览器直连） ---------------- */
const CFG_KEY = 'chulian-llm-v1';
const SYS_PROMPT = `你是「初练」——健身场馆的会员健康档案助手。
把用户说的话转成结构化字段和意图，供确定性规则引擎使用。只输出 JSON：
{"intent":"visit|review|plan|feedback|diagnosis|switch|smalltalk",
 "fields":{"fatigue":数字或null,"sleep_hours":数字或null,"pain":数字或null,
           "pain_text":"部位描述","acute_signals":[]},
 "ack":"一句自然的回话，两行以内，不要下结论"}
规则：fatigue/pain 0-10；sleep_hours 以小时计，半小时记 0.5；
只有明确说出胸痛/胸口疼/胸闷/心慌/晕倒才填 acute_signals；
说"是不是某病/严重吗"→diagnosis；"复核/通过"→review；"出计划"→plan；
"练完了/反馈"→feedback；"换个人/切换会员"→switch。
绝不输出分档结论——那是引擎的事。`;

function llmCfg(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; }
}
async function llmUnderstand(text, label){
  const cfg = llmCfg();
  if(!cfg.key) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try{
    const res = await fetch((cfg.base || 'https://api.deepseek.com').replace(/\/+$/,'') + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key},
      body: JSON.stringify({model: cfg.model || 'deepseek-chat', temperature: 0,
        response_format: {type:'json_object'},
        messages: [{role:'system', content: SYS_PROMPT},
                   {role:'user', content: `当前会员：${label}\n用户说：${text}`}]}),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const data = JSON.parse(body.choices[0].message.content);
    const f = data.fields || {};
    const clean = {};
    ['fatigue','sleep_hours','pain'].forEach(k => { if(typeof f[k] === 'number' && isFinite(f[k])) clean[k] = f[k]; });
    if(typeof f.pain_text === 'string' && f.pain_text.trim()) clean.pain_text = f.pain_text.trim();
    if(Array.isArray(f.acute_signals) && f.acute_signals.length) clean.acute = f.acute_signals.map(String);
    return {intent: String(data.intent || '').toLowerCase(), fields: clean, ack: String(data.ack || '')};
  }catch(err){
    return {intent:'', fields:{}, ack:'', error: String(err.message || err)};
  }finally{
    clearTimeout(timer);
  }
}

const KEY = 'chulian-single-v1';
let state = load();

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {members: JSON.parse(JSON.stringify(MEMBERS)), current: 0, draft: {}, need: [], stage: 'idle', last: null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function db(){ return state.members[state.current]; }

const wrap = document.getElementById('wrap');
const log = document.getElementById('log');
const input = document.getElementById('input');

function bubble(who, text, details, tone){
  const row = document.createElement('div');
  row.className = 'row ' + who;

function actionChip(row, label, fn){

  const b = document.createElement('button'); b.textContent = '→ ' + label; b.onclick = fn;
  meta.appendChild(b); row.querySelector('.bubble').appendChild(meta);

async function say(text){
  bubble('me', text);
  const m = db();
  const u = await llmUnderstand(text, `${m.A2_display_name}（${m.A1_member_id}）`);
  reply(text, u || {intent:'', fields:{}, ack:''});
}

function extract(t){
  const s = t.replace(/\s/g,'');
  const d = {};
  const half = s.replace(/(\d+)个半小时/g,'$1.5小时').replace(/半小时/g,'0.5小时');
  let m = half.match(/疲劳[^\d]{0,4}(\d{1,2})/);
  if(!m) m = half.match(/(?:累|困|疲惫)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
  if(m) d.fatigue = +m[1];
  m = half.match(/(?:睡|睡眠)[^\d]{0,8}(\d+(?:\.\d+)?)\s*(?:小时|h|钟)/);
  if(m) d.sleep_hours = +m[1];
  if(/疼|痛|酸|紧/.test(half)){
    m = half.match(/(\d{1,2})\s*分/);
    d.pain = m ? +m[1] : 3;
    const pm = half.match(/([腰膝肩背颈][^\s，,。]{0,3})/);
    d.pain_text = pm ? pm[1] : '不适';
  }
  if(/无不适|没有不舒服|没什么不舒服|没有不适|挺好的|还好|没感觉/.test(half)){ d.pain = 0; d.pain_text = '无明显不适'; }
  if(/胸痛|胸口疼|胸闷|心慌|晕|昏/.test(half)) d.acute = ['胸痛'];
  return d;
}

function reply(text, u){
  const t = text.trim();
  const intent = (u && u.intent) || '';
  if(intent === 'diagnosis' || /(是不是|会不会|严不严重|什么病|怎么回事).{0,12}(病|突出|炎|劳损|撕裂|损伤|骨折)/.test(t)){
    bubble('a','我不能判断病因，也不能诊断。这需要医生结合检查来判断。我可以帮你记录症状，并按流程提交给教练或专业人员复核。');
    return;
  }
  if(intent === 'switch' || /切换会员|换个人/.test(t)){
    state.current = (state.current + 1) % state.members.length;
    state.draft = {}; state.need = []; state.stage = 'idle'; state.last = null; save();
    const m = db();
    bubble('a', `好，现在处理的是 ${m.A2_display_name}（${m.A1_member_id}），目标：${(m.A4_goal||[]).join('、')}。说说今天的状态就行。`);
    return;
  }
  Object.assign(state.draft, extract(t));
  if(u && u.fields) Object.assign(state.draft, u.fields);

  // 上一轮问过"还差哪几项"，用户只回数字也能接住
  if(state.need && state.need.length){
    const nums = (t.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    const hasKeyword = /疲劳|累|困|睡|小时|疼|痛|酸|分/.test(t);
    if(nums.length && !hasKeyword){
      const filled = [];
      for(const v of nums){
        if(!state.need.length) break;
        const k = state.need[0];
        const isFatigue = k === 'fatigue';
        if(isFatigue ? (v < 0 || v > 10) : (v < 0 || v > 24)){
          bubble('a', `${isFatigue ? '疲劳是 0–10' : '睡眠是 0–24 小时'}，${v} 不在这个范围里，再给一个？`);
          return;
        }
        state.draft[k] = v; state.need.shift();
        filled.push(isFatigue ? `疲劳 ${v}/10` : `睡眠 ${v}h`);
      }
      if(filled.length) bubble('a', '记下了：' + filled.join('、') + '。');
      if(state.need.length){
        bubble('a', `还差 ${state.need.length} 项：${state.need.map(k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时').join('、')}。`);
        return;
      }
    }
  }

  if(state.stage === 'assessed' && (intent === 'review' || /复核|通过|可以练/.test(t))){
    if(!state.last || state.last.status_code !== 'review'){
      bubble('a', `这次判定是${state.last ? state.last.status : '继续训练'}，不需要复核。要么直接出计划，要么说说新的状态我重新判。`);
      return;
    }
    const m = db();
    m.C5_reviews = m.C5_reviews || [];
    const visit = m.B_current.B1_visit_id;
    m.C5_reviews.push({review_id:`PR-${visit}-${String(m.C5_reviews.length+1).padStart(2,'0')}`, visit_id:visit,
      decision:'approved', note:'仅允许中立位低负荷练习，禁止脊柱屈曲负荷', recorded_by:'合成教练', recorded_at:new Date().toISOString()});
    state.stage = 'reviewed'; save();
    const row = bubble('a','记下了：合成教练已复核通过（仅允许中立位低负荷，禁止脊柱屈曲）。\n注意——复核通过不等于解除活动限制，那条限制仍然生效。');
    actionChip(row, '出计划', () => say('出计划'));
    return;
  }

  if((intent === 'plan' || /出计划|生成计划/.test(t)) && (state.stage === 'assessed' || state.stage === 'reviewed')){
    try{
      const plan = createPlan(db()); save(); state.stage = 'planned';
      const sets = (plan.training.match(/每项 (\d+) 组/) || [])[1] || '?';
      const row = bubble('a', `${plan.version} 好了，每项 ${sets} 组。\n训练：${plan.training}\n饮食：${plan.diet}\n睡眠：${plan.sleep}\n限制：${plan.limitations.slice(0,2).join('；')}`);
      actionChip(row, '练完了，反馈', () => say('练完了'));
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  if(intent === 'feedback' || /练完|反馈|做完了/.test(t)){
    const fm = t.match(/疲劳[^\d]{0,4}(\d{1,2})/) || t.match(/(?:累|疲劳)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
    if(!fm){ bubble('a','练完感觉怎么样？说个疲劳分（0–10）和完成度（%）就行，比如"疲劳 8，完成度 80"。'); return; }
    const cm = t.match(/完成度\D{0,4}(\d{1,3})/);
    try{
      const [rec, plan] = addFeedback(db(), {visit_id: db().B_current.B1_visit_id,
        completion_pct: cm ? +cm[1] : 80, rpe: 6, diet_adherence:'三餐规律',
        sleep_hours: 5.5, fatigue: +fm[1], notes:'对话录入'});
      save();
      if(plan){
        bubble('a', `收到，已经更新到 ${plan.version}。${plan.change_reasons[plan.change_reasons.length-1]}。\n今天辛苦了，下一版训练量已经按你的状态调过。`,
          JSON.stringify(plan.diff_from_previous, null, 2));
      }else{
        bubble('a','这条反馈和上次一样，我记下了，计划不用改。');
      }
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  const d = state.draft;
  // 急性信号一票否决：不等其余字段，直接判定
  const hasAcute = Array.isArray(d.acute) && d.acute.length > 0;
  const needKeys = [];
  if(!hasAcute){
    if(d.fatigue === undefined) needKeys.push('fatigue');
    if(d.sleep_hours === undefined) needKeys.push('sleep_hours');
  }
  if(needKeys.length){
    state.need = needKeys.slice();
    const labelOf = k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时';
    const got = [];
    if(d.pain !== undefined) got.push('疼痛 ' + d.pain + '/10');
    if(d.fatigue !== undefined) got.push('疲劳 ' + d.fatigue + '/10');
    if(d.sleep_hours !== undefined) got.push('睡眠 ' + d.sleep_hours + 'h');
    bubble('a', (got.length ? '记下了：' + got.join('、') + '。\n' : '') +
      `还差 ${needKeys.length} 项就能判断：${needKeys.map(labelOf).join('、')}。直接回数字也行，按顺序给就好。`);
    return;
  }
  state.need = [];

  const m = db();
  m.B_current = {
    B1_visit_id: 'V-' + new Date().toISOString().slice(0,19).replace(/[-:T]/g,''),
    B2_body_feeling: {text: d.pain_text || '无特别说明', pain_score: d.pain === undefined ? 0 : d.pain, acute_signals: d.acute || []},
    B3_fatigue: d.fatigue,
    B4_sleep_last: {hours: d.sleep_hours, quality: 3},
    B5_vitals: {resting_hr: 70},
    recorded_at: new Date().toISOString(),
    recorded_by: '会员本人', source: '会员本人'
  };
  const ev = assess(m);
  state.last = ev; state.stage = 'assessed'; state.draft = {}; save();

  if(!hasAcute){
    bubble('a', ((u && u.ack) ? u.ack + '\n' : '') + `好，按你说的记下了：疲劳 ${m.B_current.B3_fatigue}/10、睡眠 ${m.B_current.B4_sleep_last.hours}h` +
      (m.B_current.B2_body_feeling.pain_score ? `、疼痛 ${m.B_current.B2_body_feeling.pain_score}/10` : '') + '。');
  }
  const detail = JSON.stringify({分档:ev.status, 规则:ev.rule, 依据字段:ev.basis_field_ids, 理由:ev.reasons, 下一步:ev.next_step}, null, 2);
  const row = bubble('a', `${ev.status}（${ev.rule}）。\n依据：${ev.basis_field_ids.slice(0,6).join('、')}。\n${ev.reasons[0] || ''}\n${ev.next_step}\n${DISCLAIMER}`, detail, TONE[ev.status_code]);
  if(ev.status_code === 'review') actionChip(row, '复核通过', () => say('复核通过'));
  if(ev.status_code === 'continue') actionChip(row, '出计划', () => say('出计划'));
}

/* ---------------- 界面事件 ---------------- */
document.getElementById('send').onclick = () => { const v = input.value; if(!v.trim()) return; input.value=''; say(v); };
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); const v = input.value; if(!v.trim()) return; input.value=''; say(v); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(120, input.scrollHeight) + 'px'; });
const CFG = llmCfg();
document.getElementById('cfg').onclick = () => {
  const p = document.getElementById('panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  const c = llmCfg();

  document.getElementById('cfg-model').value = c.model || 'deepseek-chat';
};
document.getElementById('cfg-save').onclick = () => {
  const c = {key: document.getElementById('cfg-key').value.trim(),
             base: document.getElementById('cfg-base').value.trim() || 'https://api.deepseek.com',
             model: document.getElementById('cfg-model').value.trim() || 'deepseek-chat'};
  localStorage.setItem(CFG_KEY, JSON.stringify(c));

  refreshBadge();
  bubble('a', c.key ? `已接入大模型（${c.model}），可以让说法更自由了。判定仍然由引擎给出。` : '已清除模型配置，回到离线规则模式。');
};
document.getElementById('cfg-clear').onclick = () => {
  localStorage.removeItem(CFG_KEY);
  document.getElementById('panel').style.display = 'none';
  refreshBadge();
  bubble('a','已回到离线规则模式。');
};
function refreshBadge(){
  const c = llmCfg();
  document.getElementById('badge').textContent = '技能 2.0.0 · 55 项测试 · ' + (c.key ? '大模型（' + (c.model || 'deepseek-chat') + '）' : '离线规则引擎');
}
refreshBadge();

document.getElementById('switch').onclick = () => say('切换会员');
document.getElementById('reset').onclick = () => { localStorage.removeItem(KEY); location.reload(); };
if(window.innerWidth < 560){ input.placeholder = '说说今天的状态…'; }

const m0 = db();
bubble('a', `我是初练，管这台会员档案。现在处理的是 ${m0.A2_display_name}（${m0.A1_member_id}），上次的记录我都读过了。\n说说今天的状态就行，比如"今天有点累，腰酸 4 分，昨晚睡了 5 小时"。`);

</script>
<script>
/* ---------------- 开场、3D 场景与微交互 ---------------- */
(function(){
  const intro = document.getElementById('intro');
  const hero  = document.getElementById('hero');
  const wrap  = document.getElementById('wrap');

  // 开场：2.1 秒后上移离场，页面淡入
  document.body.classList.add('ready');
  setTimeout(() => intro.classList.add('done'), 2100);
  setTimeout(() => { intro.style.display = 'none'; }, 2900);

  // 第一条消息出现时收起空态
  const hideHero = () => {
    if (!hero || hero.classList.contains('gone')) return;
    hero.classList.add('gone');
  };
  new MutationObserver((ms) => {
    for (const m of ms) if (m.addedNodes.length) { hideHero(); break; }
  }).observe(wrap, { childList: true });

  // 建议词填入
  document.querySelectorAll('[data-fill]').forEach(b => {
    b.addEventListener('click', () => {
      const input = document.getElementById('input');
      input.value = b.dataset.fill;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  });

  /* ---- 等距健身房：canvas 2D ---- */
  const cv = document.getElementById('scene');
  if (cv) {
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const r = cv.getBoundingClientRect();
      W = r.width; H = r.height;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener('resize', resize);

    let tilt = 0, tiltTarget = 0, px = 0;
    cv.addEventListener('pointermove', e => {
      const r = cv.getBoundingClientRect();
      tiltTarget = ((e.clientX - r.left) / r.width - 0.5) * 0.16;
    });
    cv.addEventListener('pointerleave', () => { tiltTarget = 0; });

    const SCALE = 1.34;
    const iso = (x, y, z) => {
      const a = Math.PI / 6 + tilt;
      return [ (x - y) * Math.cos(a) * SCALE, ((x + y) * Math.sin(a) - z) * SCALE ];
    };

    function shadow(cx, cy, rx, ry, alpha) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      g.addColorStop(0, `rgba(10,14,22,${alpha})`);
      g.addColorStop(1, 'rgba(10,14,22,0)');
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, ry / rx);
      ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    }

    function box(cx, cy, w, d, h, tone) {
      const p = (x, y, z) => { const q = iso(x, y, z); return [cx + q[0], cy + q[1]]; };
      const faces = [
        { pts: [p(-w/2,-d/2,0), p(w/2,-d/2,0), p(w/2,d/2,0), p(-w/2,d/2,0)], fill: tone[0] },
        { pts: [p(-w/2,d/2,0), p(w/2,d/2,0), p(w/2,d/2,h), p(-w/2,d/2,h)], fill: tone[1] },
        { pts: [p(w/2,-d/2,0), p(w/2,d/2,0), p(w/2,d/2,h), p(w/2,-d/2,h)], fill: tone[2] }
      ];
      faces.forEach(f => {
        ctx.beginPath();
        f.pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
        ctx.closePath();
        ctx.fillStyle = f.fill; ctx.fill();
      });
    }

    function plate(cx, cy, r, fill) {
      ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
    }

    function floor(cx, cy, size) {
      ctx.save();
      ctx.lineWidth = 1;
      const steps = 9;
      for (let i = 0; i <= steps; i++) {
        const t = -size / 2 + (size / steps) * i;
        const alpha = 0.09 * (1 - Math.abs(t) / size);
        ctx.strokeStyle = `rgba(10,14,22,${alpha})`;
        let a = iso(t, -size / 2, 0), b = iso(t, size / 2, 0);
        ctx.beginPath(); ctx.moveTo(cx + a[0], cy + a[1]); ctx.lineTo(cx + b[0], cy + b[1]); ctx.stroke();
        a = iso(-size / 2, t, 0); b = iso(size / 2, t, 0);
        ctx.beginPath(); ctx.moveTo(cx + a[0], cy + a[1]); ctx.lineTo(cx + b[0], cy + b[1]); ctx.stroke();
      }
      ctx.restore();
    }

    const T = {
      white: ['#FFFFFF', '#E6E9EF', '#D3D8E1'],
      grey:  ['#F4F5F8', '#DEE2E9', '#C9CED9'],
      dark:  ['#2A2E36', '#1B1F26', '#12151A'],
      blue:  ['#E8F0FD', '#CFDFF9', '#B9CEF2']
    };

    let t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      tilt += (tiltTarget - tilt) * 0.08;
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2 + tilt * 120, cy = H * 0.55;
      const bob = Math.sin(t * 0.9) * 2.4;

      // 背景光晕
      const glow = ctx.createRadialGradient(cx, cy - 30, 10, cx, cy - 30, Math.max(W, H) * 0.62);
      glow.addColorStop(0, 'rgba(0,113,227,.055)');
      glow.addColorStop(.55, 'rgba(0,113,227,.018)');
      glow.addColorStop(1, 'rgba(0,113,227,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      floor(cx, cy + bob, 320);

      // 接触阴影
      shadow(cx - 44, cy + 8 + bob, 96, 26, 0.13);
      shadow(cx + 62, cy + 6 + bob, 62, 20, 0.12);
      shadow(cx + 4, cy + 34 + bob, 46, 16, 0.1);

      // 训练床：底板、软垫、两组支腿
      box(cx - 44, cy - 22 + bob, 112, 40, 8, T.grey);
      box(cx - 44, cy - 22 + bob, 104, 34, 9, T.white);
      box(cx - 86, cy - 12 + bob, 9, 9, 20, T.grey);
      box(cx - 2, cy - 12 + bob, 9, 9, 20, T.grey);
      // 靠背
      box(cx - 92, cy - 40 + bob, 30, 30, 6, T.white);

      // 跑步机（左前方）
      box(cx - 118, cy + 44 + bob, 74, 30, 6, T.dark);
      box(cx - 118, cy + 44 + bob, 66, 24, 3, T.grey);

      // 器械架与横杆
      box(cx + 58, cy - 30 + bob, 24, 24, 66, T.grey);
      box(cx + 58, cy - 68 + bob, 54, 5, 3, T.dark);
      plate(cx + 30, cy - 70 + bob, 10, '#2A2E36');
      plate(cx + 86, cy - 70 + bob, 10, '#2A2E36');

      // 哑铃
      box(cx + 2, cy + 30 + bob, 26, 12, 5, T.white);
      box(cx + 2, cy + 30 + bob, 6, 14, 12, T.dark);

      // 蓝色训练垫
      box(cx - 108, cy + 18 + bob, 52, 36, 3, T.blue);

      // 蓝色脉冲：标记正在核对的位置
      const pulse = 0.5 + 0.5 * Math.sin(t * 2);
      const q = iso(-44, -22, 12);
      ctx.save();
      ctx.globalAlpha = 0.3 + pulse * 0.35;
      ctx.fillStyle = '#0071E3';
      ctx.beginPath();
      ctx.arc(cx + q[0], cy + q[1] + bob, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.1 + pulse * 0.14;
      ctx.beginPath();
      ctx.arc(cx + q[0], cy + q[1] + bob, 8 + pulse * 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
