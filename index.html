<html lang="zh-CN">
<head>

<style>

</head>

      if(hours < 5) reasons.push('睡眠 ' + hours + 'h');
      if(spike > 50) reasons.push('近4周强度增幅 ' + spike + '%');
      return result(db,'review','R2-a', reasons, ['A6','A12','B3','B4'], '由教练或相应专业人员复核，确认前不生成正式计划。');
    }
    if(fatigue >= 8 || hours < 5 || (pain !== null && pain >= 6) || spike > 50){
      const reasons = [];
      if(fatigue >= 8) reasons.push('疲劳 ' + fatigue + '/10');
      if(hours < 5) reasons.push('睡眠 ' + hours + 'h');
      if(pain !== null && pain >= 6) reasons.push('疼痛 ' + pain + '/10');
      if(spike > 50) reasons.push('强度增幅 ' + spike + '%');
      return result(db,'review','R2-d', reasons, ['A6','B2','B3','B4'], '先复核状态；不得仅以降低强度替代风险升级。');
    }
    const reasons = ['未发现规则表中的暂停或复核条件'];
    if(conf.status === 'not_provided') reasons.push('活动限制为本人未提供，按保守边界执行');
    return result(db,'continue','R4', reasons, ['A5','A6','A9','B2','B3','B4'], '按既有活动限制安排训练，出现不适立即停止。');
  }catch(err){
    return result(db,'review','R0',['资料无法可靠解析：'+err.message],['DATA_QUALITY'],'由人工核对资料；解析异常不得默认放行。');
  }
}

function planGate(db, ev){
  if(ev.status_code === 'continue') return [true,''];
  if(ev.status_code === 'review' && approvedReview(db, ev.visit_id)) return [true,''];
  if(ev.status_code === 'pause') return [false, '当前为「暂停活动」（'+ev.rule+'），属于急性信号或未到期禁训，不能通过复核解除；请暂停本次安排，待身体恢复后重新填报'];
  if(ev.status_code === 'missing') return [false, '当前为「补充资料」，资料不完整时不得生成正式计划；请先补齐后再评估'];
  return [false, '当前为「'+ev.status+'」，未通过复核，不能生成正式计划'];
}
function createPlan(db){
  db.C2_plans = db.C2_plans || []; db.C1_visits = db.C1_visits || [];
  const ev = assess(db);
  const ok = planGate(db, ev);
  if(!ok[0]) throw new Error(ok[1]);
  const visit = ev.visit_id;
  const same = db.C1_visits.filter(v => v.visit_id === visit).pop();
  const reduced = same && typeof same.fatigue === 'number' && same.fatigue >= 7;
  const sets = reduced ? 1 : (ev.status_code === 'review' ? 2 : 3);
  const exp = db.A5_experience || {};
  const goals = (db.A4_goal||[]).join('、') || '一般体能维护';
  const restr = (db.A9_restrictions||[]).map(r => r.item).join('；') || '按已确认的活动边界执行';
  const training = `围绕${goals}安排中立位呼吸、肩胛控制与轻柔髋部活动，每项 ${sets} 组，每组 6—8 次；经验级别：${exp.equipment || '未注明'}。`;
  const dietText = (db.A10_diet && db.A10_diet.text) || '未提供饮食偏好';
  const diet = `维持规律三餐与适量饮水，结合既有记录（${dietText}）避免推荐不适宜食物；不提供治疗性饮食方案。`;
  const sp = db.A11_sleep_profile || {};
  const parts = [];
  if(typeof sp.average_hours === 'number') parts.push('平均 ' + sp.average_hours + 'h');
  if(typeof sp.quality === 'number') parts.push('自评质量 ' + sp.quality + '/5');
  if(sp.issue && !['无','无特殊','无特殊问题'].includes(sp.issue)) parts.push(sp.issue);
  const sleep = `保持固定起床时间，睡前30分钟减少屏幕刺激；结合既有睡眠记录（${parts.join('、') || '未提供'}），先观察作息稳定性。`;
  const version = 'v' + (db.C2_plans.length + 1);
  (db.C2_plans||[]).forEach(p => { if(p.status === 'active'){ p.status = 'superseded'; p.superseded_by = version; } });
  const reasons = ['依据会员目标、训练经验、活动限制和当日风险状态生成'];
  const last = db.C1_visits[db.C1_visits.length-1];
  if(last) reasons.push(`上次离店（${last.visit_id}）完成度 ${last.completion_pct}%，疲劳 ${last.fatigue}/10`);
  if(reduced) reasons.push('离店疲劳达到 7/10 以上，下一版训练量下调');
  const limitations = [restr, '专业限制优先；不替代医疗、营养或康复专业意见'];
  if((db.A9_confirmation||{}).status === 'not_provided') limitations.unshift('活动限制未提供：本次不安排脊柱屈曲与关节高负荷动作（保守边界）');
  const prev = db.C2_plans[db.C2_plans.length-1];
  const plan = {version, status:'active', training, diet, sleep,
    basis_field_ids:['A4','A5','A9','A10','A11','B1'].concat(last?['C1']:[]),
    limitations, change_reasons: reasons,
    diff_from_previous: prev ? ['training','diet','sleep'].filter(k => prev[k] !== ({training,diet,sleep})[k])
      .map(k => ({section:{training:'训练',diet:'饮食',sleep:'睡眠'}[k], before:prev[k], after:{training,diet,sleep}[k], reason:reasons.join('；')})) : []};
  db.C2_plans.push(plan);
  return plan;
}
function addFeedback(db, payload){
  db.C1_visits = db.C1_visits || []; db.C7_revisions = db.C7_revisions || [];
  const cur = (db.B_current||{}).B1_visit_id;
  if(cur && payload.visit_id !== cur) throw new Error(`反馈的到店记录 ${payload.visit_id} 与当前到店记录 ${cur} 不一致；计划调整只依据本次到店反馈`);
  ['completion_pct','rpe','sleep_hours','fatigue'].forEach(k => num(payload[k], k, 0, 100));
  const keys = ['visit_id','completion_pct','rpe','diet_adherence','sleep_hours','fatigue','notes'];
  const exist = db.C1_visits.find(v => v.visit_id === payload.visit_id);
  if(exist && keys.every(k => exist[k] === payload[k])) return [exist, null];
  if(exist){
    db.C7_revisions.push({record_id:'C1-'+payload.visit_id, before: JSON.parse(JSON.stringify(exist)), after: JSON.parse(JSON.stringify(payload))});
    Object.assign(exist, payload);
  }else{
    db.C1_visits.push(Object.assign({record_id:'C1-'+payload.visit_id}, payload));
  }
  const ev = assess(db);
  let plan = null;
  if(planGate(db, ev)[0]) plan = createPlan(db);
  return [exist || db.C1_visits[db.C1_visits.length-1], plan];
}

/* ---------------- 大模型（可选，浏览器直连） ---------------- */
const CFG_KEY = 'chulian-llm-v1';
const SYS_PROMPT = `你是「初练」——健身场馆的会员健康档案助手。
把用户说的话转成结构化字段和意图，供确定性规则引擎使用。只输出 JSON：
{"intent":"visit|review|plan|feedback|diagnosis|switch|smalltalk",
 "fields":{"fatigue":数字或null,"sleep_hours":数字或null,"pain":数字或null,
           "pain_text":"部位描述","acute_signals":[]},
 "ack":"一句自然的回话，两行以内，不要下结论"}
规则：fatigue/pain 0-10；sleep_hours 以小时计，半小时记 0.5；
只有明确说出胸痛/胸口疼/胸闷/心慌/晕倒才填 acute_signals；
说"是不是某病/严重吗"→diagnosis；"复核/通过"→review；"出计划"→plan；
"练完了/反馈"→feedback；"换个人/切换会员"→switch。
绝不输出分档结论——那是引擎的事。`;

function llmCfg(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; }
}
async function llmUnderstand(text, label){
  const cfg = llmCfg();
  if(!cfg.key) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try{
    const res = await fetch((cfg.base || 'https://api.deepseek.com').replace(/\/+$/,'') + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key},
      body: JSON.stringify({model: cfg.model || 'deepseek-chat', temperature: 0,
        response_format: {type:'json_object'},
        messages: [{role:'system', content: SYS_PROMPT},
                   {role:'user', content: `当前会员：${label}\n用户说：${text}`}]}),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const data = JSON.parse(body.choices[0].message.content);
    const f = data.fields || {};
    const clean = {};
    ['fatigue','sleep_hours','pain'].forEach(k => { if(typeof f[k] === 'number' && isFinite(f[k])) clean[k] = f[k]; });
    if(typeof f.pain_text === 'string' && f.pain_text.trim()) clean.pain_text = f.pain_text.trim();
    if(Array.isArray(f.acute_signals) && f.acute_signals.length) clean.acute = f.acute_signals.map(String);
    return {intent: String(data.intent || '').toLowerCase(), fields: clean, ack: String(data.ack || '')};
  }catch(err){
    return {intent:'', fields:{}, ack:'', error: String(err.message || err)};
  }finally{
    clearTimeout(timer);
  }
}

const KEY = 'chulian-single-v1';
let state = load();

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {members: JSON.parse(JSON.stringify(MEMBERS)), current: 0, draft: {}, need: [], stage: 'idle', last: null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function db(){ return state.members[state.current]; }

const wrap = document.getElementById('wrap');
const log = document.getElementById('log');
const input = document.getElementById('input');

function bubble(who, text, details, tone){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const av = document.createElement('div');
  av.className = 'av ' + (who === 'a' ? 'a' : 'm');
  av.textContent = who === 'a' ? '初' : '我';
  const body = document.createElement('div');
  body.className = 'bubble';
  const p = document.createElement('div');
  p.textContent = text;
  if(tone) p.classList.add('verdict', tone);
  body.appendChild(p);
  if(details){
    const meta = document.createElement('div'); meta.className = 'meta';
    const btn = document.createElement('button'); btn.textContent = '查看依据';
    const d = document.createElement('div'); d.className = 'detail'; d.textContent = details;
    btn.onclick = () => { d.style.display = d.style.display === 'block' ? 'none' : 'block'; };
    meta.appendChild(btn); body.appendChild(meta); body.appendChild(d);
  }
  row.appendChild(av); row.appendChild(body); wrap.appendChild(row);
  log.scrollTop = log.scrollHeight; return row;
}
function actionChip(row, label, fn){
  const meta = document.createElement('div'); meta.className = 'meta';
  const b = document.createElement('button'); b.textContent = '→ ' + label; b.onclick = fn;
  meta.appendChild(b); row.querySelector('.bubble').appendChild(meta);
}
async function say(text){
  bubble('me', text);
  const m = db();
  const u = await llmUnderstand(text, `${m.A2_display_name}（${m.A1_member_id}）`);
  reply(text, u || {intent:'', fields:{}, ack:''});
}

function extract(t){
  const s = t.replace(/\s/g,'');
  const d = {};
  const half = s.replace(/(\d+)个半小时/g,'$1.5小时').replace(/半小时/g,'0.5小时');
  let m = half.match(/疲劳[^\d]{0,4}(\d{1,2})/);
  if(!m) m = half.match(/(?:累|困|疲惫)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
  if(m) d.fatigue = +m[1];
  m = half.match(/(?:睡|睡眠)[^\d]{0,8}(\d+(?:\.\d+)?)\s*(?:小时|h|钟)/);
  if(m) d.sleep_hours = +m[1];
  if(/疼|痛|酸|紧/.test(half)){
    m = half.match(/(\d{1,2})\s*分/);
    d.pain = m ? +m[1] : 3;
    const pm = half.match(/([腰膝肩背颈][^\s，,。]{0,3})/);
    d.pain_text = pm ? pm[1] : '不适';
  }
  if(/无不适|没有不舒服|没什么不舒服|没有不适|挺好的|还好|没感觉/.test(half)){ d.pain = 0; d.pain_text = '无明显不适'; }
  if(/胸痛|胸口疼|胸闷|心慌|晕|昏/.test(half)) d.acute = ['胸痛'];
  return d;
}

function reply(text, u){
  const t = text.trim();
  const intent = (u && u.intent) || '';
  if(intent === 'diagnosis' || /(是不是|会不会|严不严重|什么病|怎么回事).{0,12}(病|突出|炎|劳损|撕裂|损伤|骨折)/.test(t)){
    bubble('a','我不能判断病因，也不能诊断。这需要医生结合检查来判断。我可以帮你记录症状，并按流程提交给教练或专业人员复核。');
    return;
  }
  if(intent === 'switch' || /切换会员|换个人/.test(t)){
    state.current = (state.current + 1) % state.members.length;
    state.draft = {}; state.need = []; state.stage = 'idle'; state.last = null; save();
    const m = db();
    bubble('a', `好，现在处理的是 ${m.A2_display_name}（${m.A1_member_id}），目标：${(m.A4_goal||[]).join('、')}。说说今天的状态就行。`);
    return;
  }
  Object.assign(state.draft, extract(t));
  if(u && u.fields) Object.assign(state.draft, u.fields);

  // 上一轮问过"还差哪几项"，用户只回数字也能接住
  if(state.need && state.need.length){
    const nums = (t.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    const hasKeyword = /疲劳|累|困|睡|小时|疼|痛|酸|分/.test(t);
    if(nums.length && !hasKeyword){
      const filled = [];
      for(const v of nums){
        if(!state.need.length) break;
        const k = state.need[0];
        const isFatigue = k === 'fatigue';
        if(isFatigue ? (v < 0 || v > 10) : (v < 0 || v > 24)){
          bubble('a', `${isFatigue ? '疲劳是 0–10' : '睡眠是 0–24 小时'}，${v} 不在这个范围里，再给一个？`);
          return;
        }
        state.draft[k] = v; state.need.shift();
        filled.push(isFatigue ? `疲劳 ${v}/10` : `睡眠 ${v}h`);
      }
      if(filled.length) bubble('a', '记下了：' + filled.join('、') + '。');
      if(state.need.length){
        bubble('a', `还差 ${state.need.length} 项：${state.need.map(k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时').join('、')}。`);
        return;
      }
    }
  }

  if(state.stage === 'assessed' && (intent === 'review' || /复核|通过|可以练/.test(t))){
    if(!state.last || state.last.status_code !== 'review'){
      bubble('a', `这次判定是${state.last ? state.last.status : '继续训练'}，不需要复核。要么直接出计划，要么说说新的状态我重新判。`);
      return;
    }
    const m = db();
    m.C5_reviews = m.C5_reviews || [];
    const visit = m.B_current.B1_visit_id;
    m.C5_reviews.push({review_id:`PR-${visit}-${String(m.C5_reviews.length+1).padStart(2,'0')}`, visit_id:visit,
      decision:'approved', note:'仅允许中立位低负荷练习，禁止脊柱屈曲负荷', recorded_by:'合成教练', recorded_at:new Date().toISOString()});
    state.stage = 'reviewed'; save();
    const row = bubble('a','记下了：合成教练已复核通过（仅允许中立位低负荷，禁止脊柱屈曲）。\n注意——复核通过不等于解除活动限制，那条限制仍然生效。');
    actionChip(row, '出计划', () => say('出计划'));
    return;
  }

  if((intent === 'plan' || /出计划|生成计划/.test(t)) && (state.stage === 'assessed' || state.stage === 'reviewed')){
    try{
      const plan = createPlan(db()); save(); state.stage = 'planned';
      const sets = (plan.training.match(/每项 (\d+) 组/) || [])[1] || '?';
      const row = bubble('a', `${plan.version} 好了，每项 ${sets} 组。\n训练：${plan.training}\n饮食：${plan.diet}\n睡眠：${plan.sleep}\n限制：${plan.limitations.slice(0,2).join('；')}`);
      actionChip(row, '练完了，反馈', () => say('练完了'));
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  if(intent === 'feedback' || /练完|反馈|做完了/.test(t)){
    const fm = t.match(/疲劳[^\d]{0,4}(\d{1,2})/) || t.match(/(?:累|疲劳)[^\d，,。！？]{0,3}(\d{1,2})\s*分/);
    if(!fm){ bubble('a','练完感觉怎么样？说个疲劳分（0–10）和完成度（%）就行，比如"疲劳 8，完成度 80"。'); return; }
    const cm = t.match(/完成度\D{0,4}(\d{1,3})/);
    try{
      const [rec, plan] = addFeedback(db(), {visit_id: db().B_current.B1_visit_id,
        completion_pct: cm ? +cm[1] : 80, rpe: 6, diet_adherence:'三餐规律',
        sleep_hours: 5.5, fatigue: +fm[1], notes:'对话录入'});
      save();
      if(plan){
        bubble('a', `收到，已经更新到 ${plan.version}。${plan.change_reasons[plan.change_reasons.length-1]}。\n今天辛苦了，下一版训练量已经按你的状态调过。`,
          JSON.stringify(plan.diff_from_previous, null, 2));
      }else{
        bubble('a','这条反馈和上次一样，我记下了，计划不用改。');
      }
    }catch(err){ bubble('a', err.message, null, 'warn'); }
    return;
  }

  const d = state.draft;
  // 急性信号一票否决：不等其余字段，直接判定
  const hasAcute = Array.isArray(d.acute) && d.acute.length > 0;
  const needKeys = [];
  if(!hasAcute){
    if(d.fatigue === undefined) needKeys.push('fatigue');
    if(d.sleep_hours === undefined) needKeys.push('sleep_hours');
  }
  if(needKeys.length){
    state.need = needKeys.slice();
    const labelOf = k => k === 'fatigue' ? '疲劳（0–10）' : '昨晚睡了几小时';
    const got = [];
    if(d.pain !== undefined) got.push('疼痛 ' + d.pain + '/10');
    if(d.fatigue !== undefined) got.push('疲劳 ' + d.fatigue + '/10');
    if(d.sleep_hours !== undefined) got.push('睡眠 ' + d.sleep_hours + 'h');
    bubble('a', (got.length ? '记下了：' + got.join('、') + '。\n' : '') +
      `还差 ${needKeys.length} 项就能判断：${needKeys.map(labelOf).join('、')}。直接回数字也行，按顺序给就好。`);
    return;
  }
  state.need = [];

  const m = db();
  m.B_current = {
    B1_visit_id: 'V-' + new Date().toISOString().slice(0,19).replace(/[-:T]/g,''),
    B2_body_feeling: {text: d.pain_text || '无特别说明', pain_score: d.pain === undefined ? 0 : d.pain, acute_signals: d.acute || []},
    B3_fatigue: d.fatigue,
    B4_sleep_last: {hours: d.sleep_hours, quality: 3},
    B5_vitals: {resting_hr: 70},
    recorded_at: new Date().toISOString(),
    recorded_by: '会员本人', source: '会员本人'
  };
  const ev = assess(m);
  state.last = ev; state.stage = 'assessed'; state.draft = {}; save();

  if(!hasAcute){
    bubble('a', ((u && u.ack) ? u.ack + '\n' : '') + `好，按你说的记下了：疲劳 ${m.B_current.B3_fatigue}/10、睡眠 ${m.B_current.B4_sleep_last.hours}h` +
      (m.B_current.B2_body_feeling.pain_score ? `、疼痛 ${m.B_current.B2_body_feeling.pain_score}/10` : '') + '。');
  }
  const detail = JSON.stringify({分档:ev.status, 规则:ev.rule, 依据字段:ev.basis_field_ids, 理由:ev.reasons, 下一步:ev.next_step}, null, 2);
  const row = bubble('a', `${ev.status}（${ev.rule}）。\n依据：${ev.basis_field_ids.slice(0,6).join('、')}。\n${ev.reasons[0] || ''}\n${ev.next_step}\n${DISCLAIMER}`, detail, TONE[ev.status_code]);
  if(ev.status_code === 'review') actionChip(row, '复核通过', () => say('复核通过'));
  if(ev.status_code === 'continue') actionChip(row, '出计划', () => say('出计划'));
}

document.getElementById('cfg-save').onclick = () => {
  const c = {key: document.getElementById('cfg-key').value.trim(),
             base: document.getElementById('cfg-base').value.trim() || 'https://api.deepseek.com',
             model: document.getElementById('cfg-model').value.trim() || 'deepseek-chat'};
  localStorage.setItem(CFG_KEY, JSON.stringify(c));
  document.getElementById('panel').style.display = 'none';
  refreshBadge();
  bubble('a', c.key ? `已接入大模型（${c.model}），可以让说法更自由了。判定仍然由引擎给出。` : '已清除模型配置，回到离线规则模式。');
};
document.getElementById('cfg-clear').onclick = () => {
  localStorage.removeItem(CFG_KEY);
  document.getElementById('panel').style.display = 'none';
  refreshBadge();
  bubble('a','已回到离线规则模式。');
};
function refreshBadge(){
  const c = llmCfg();
  document.getElementById('badge').textContent = '技能 2.0.0 · 55 项测试 · ' + (c.key ? '大模型（' + (c.model || 'deepseek-chat') + '）' : '离线规则引擎');
}
refreshBadge();

document.getElementById('switch').onclick = () => say('切换会员');
